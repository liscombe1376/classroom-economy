<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>BCE GRAND PRIX | VISUAL JUICE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; }
        .admin-panel { background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #3b82f6; backdrop-filter: blur(5px); }
        select, input { background: #1e293b; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; color: white; font-size: 0.85rem; outline: none; }
        #countdown { font-size: 140px; font-weight: 900; text-shadow: 0 0 30px rgba(59, 130, 246, 0.8); pointer-events: none; }
    </style>
</head>
<body>

    <div class="admin-panel fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center px-8">
        <div class="flex items-center gap-6">
            <h1 class="text-3xl font-black italic uppercase text-white">BCE <span class="text-blue-500">GP</span></h1>
            
            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Track</label>
                <select id="trackSelect" onchange="initRaceData()">
                    <option value="pro">Pro Circuit (Balanced)</option>
                    <option value="mud">The Snake (Technical)</option>
                    <option value="oval">The Oval (Speedway)</option>
                    <option value="drag">Drag Strip (Sprint)</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Heat</label>
                <input type="number" id="heatSelect" value="1" min="1" class="w-16" onchange="initRaceData()">
            </div>

            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Laps</label>
                <input type="number" id="totalLaps" value="3" min="1" class="w-16">
            </div>
        </div>

        <div id="raceStats" class="flex gap-8 items-center">
            <div class="text-right">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Leader</div>
                <div id="leaderName" class="text-xl font-black text-blue-400">---</div>
            </div>
            <button onclick="startCountdown()" id="startBtn" class="bg-blue-600 px-8 py-3 rounded-md font-bold hover:bg-blue-500 shadow-lg transition-all active:scale-95 uppercase tracking-widest text-sm">Start Race</button>
        </div>
    </div>

    <div id="countdown" class="fixed inset-0 flex items-center justify-center z-40 hidden italic uppercase"></div>

    <canvas id="raceCanvas"></canvas>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let racers = [];
        let scenery = [];
        let particles = [];
        let skidMarks = [];
        let raceActive = false;
        let raceFinished = false;

        const tracks = {
            pro: [ {x: 0.5, y: 0.85}, {x: 0.2, y: 0.85}, {x: 0.15, y: 0.85}, {x: 0.15, y: 0.25}, {x: 0.4, y: 0.2}, {x: 0.5, y: 0.45}, {x: 0.7, y: 0.2}, {x: 0.85, y: 0.3}, {x: 0.85, y: 0.7}, {x: 0.7, y: 0.85}, {x: 0.5, y: 0.85} ],
            mud: [ {x: 0.5, y: 0.8}, {x: 0.2, y: 0.8}, {x: 0.1, y: 0.5}, {x: 0.25, y: 0.2}, {x: 0.5, y: 0.4}, {x: 0.45, y: 0.1}, {x: 0.75, y: 0.2}, {x: 0.65, y: 0.5}, {x: 0.9, y: 0.6}, {x: 0.8, y: 0.85}, {x: 0.5, y: 0.8} ],
            oval: [ {x: 0.5, y: 0.85}, {x: 0.2, y: 0.85}, {x: 0.1, y: 0.5}, {x: 0.2, y: 0.15}, {x: 0.8, y: 0.15}, {x: 0.9, y: 0.5}, {x: 0.8, y: 0.85}, {x: 0.5, y: 0.85} ],
            drag: [ {x: 0.1, y: 0.5}, {x: 0.9, y: 0.5} ]
        };

        function generateScenery() {
            scenery = [];
            for(let i=0; i<50; i++) {
                scenery.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: 10+Math.random()*25, type: Math.random()>0.4?'tree':'rock', color: `hsl(${120+Math.random()*20}, ${40+Math.random()*20}%, ${20+Math.random()*20}%)` });
            }
        }

        async function initRaceData() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateScenery();
            particles = []; skidMarks = [];
            
            const selectedHeat = document.getElementById('heatSelect').value;
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getHeat", heat: selectedHeat }) });
                const data = await res.json();
                
                if (!data.racers || data.racers.length === 0) {
                    racers = []; draw(); return;
                }

                racers = data.racers.map((r, i) => {
                    let speed = 0.0010; 
                    let grip = 1.0;
                    if(r.motor === "V8 Engine") speed += 0.0006;
                    if(r.tires === "Slicks") grip += 0.8;

                    return { 
                        ...r, 
                        progress: 0 - (i * 0.015),
                        lap: 1, 
                        speedBase: speed, 
                        gripBase: grip, // Visual Juice 2: Grippier tires drift less
                        laneOffset: (i - (data.racers.length/2)) * 14, 
                        currentDrift: 0,
                        finished: false, 
                        color: r.color || "#3b82f6",
                        particleTimer: 0 
                    };
                });
                draw();
            } catch (e) { console.error("Init Error:", e); }
        }

        function getPointOnPath(t, trackType) {
            const path = tracks[trackType];
            const sections = path.length - 1;
            const progress = Math.max(0, Math.min(0.999, t));
            const section = Math.min(Math.floor(progress * sections), sections - 1);
            const sectionT = (progress * sections) - section;
            const p1 = path[section]; const p2 = path[section + 1];
            return { 
                x: (p1.x + (p2.x - p1.x) * sectionT) * canvas.width, 
                y: (p1.y + (p2.y - p1.y) * sectionT) * canvas.height, 
                angle: Math.atan2((p2.y - p1.y), (p2.x - p1.x)) + Math.PI/2, 
                isCorner: (sectionT < 0.2 || sectionT > 0.8) && trackType !== 'drag' 
            };
        }

        function drawScenery() {
            scenery.forEach(s => {
                ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.beginPath(); ctx.arc(s.x+4, s.y+4, s.size, 0, Math.PI*2); ctx.fill();
                if(s.type === 'tree') { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
                } else { ctx.fillStyle = "#4f4f4f"; ctx.beginPath(); ctx.roundRect(s.x, s.y, s.size, s.size*0.8, 6); ctx.fill(); }
            });
        }

        function drawTrack() {
            const type = document.getElementById('trackSelect').value; const path = tracks[type];
            if(type === 'drag') return;
            
            // Draw Skid Marks (Visual Juice 1)
            ctx.fillStyle = "rgba(0,0,0,0.03)";
            skidMarks.forEach(skid => { ctx.beginPath(); ctx.arc(skid.x, skid.y, skid.size, 0, Math.PI*2); ctx.fill(); });

            ctx.strokeStyle = "#475569"; ctx.lineWidth = 110; ctx.lineJoin = "round"; ctx.lineCap = "round"; 
            ctx.setLineDash([15, 15]); ctx.beginPath();
            path.forEach((p, i) => i === 0 ? ctx.moveTo(p.x*canvas.width, p.y*canvas.height) : ctx.lineTo(p.x*canvas.width, p.y*canvas.height)); ctx.stroke();
            ctx.strokeStyle = "#ef4444"; ctx.lineDashOffset = 15; ctx.stroke(); ctx.setLineDash([]);
            ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 98; ctx.stroke();
            
            // Start Line
            const start = path[0]; const next = path[1]; const angle = Math.atan2((next.y - start.y), (next.x - start.x));
            ctx.save(); ctx.translate(start.x * canvas.width, start.y * canvas.height); ctx.rotate(angle);
            ctx.fillStyle = "white"; ctx.fillRect(-5, -50, 10, 100); ctx.fillStyle = "black";
            for(let row=0; row<10; row++) { for(let col=0; col<2; col++) { if((row+col)%2==0) ctx.fillRect(col*5-5, row*10-50, 5, 10); } }
            ctx.restore();
        }

        function gameLoop() {
            if(!raceActive) return;
            const type = document.getElementById('trackSelect').value;
            const maxLaps = parseInt(document.getElementById('totalLaps').value);

            // Visual Juice 1: Manage particles and skids
            particles.forEach((p,i) => { p.y -= p.vy; p.alpha -= 0.02; if(p.alpha <=0) particles.splice(i,1); });
            skidMarks.forEach((s,i) => { s.alpha -= 0.005; if(s.alpha <=0) skidMarks.splice(i,1); });

            racers.forEach(r => {
                if(r.finished) return;
                const pos = getPointOnPath(Math.max(0, r.progress), type);
                let step = r.speedBase;
                
                // Visual Juice 2: Perspective drift logic
                let targetDrift = 0;
                if(pos.isCorner) {
                    step *= 0.7; // Slow down in corner
                    targetDrift = (r.laneOffset > 0 ? 1 : -1) * (30 / r.gripBase); // Swing out based on grip

                    // Drop Skid Mark
                    if(Math.random()>0.4) { skidMarks.push({ x: pos.x + r.currentDrift, y: pos.y + r.currentDrift, size: 8+Math.random()*4, alpha: 0.3 }); }
                }
                r.currentDrift += (targetDrift - r.currentDrift) * 0.1; // Smooth transition

                r.progress += step;

                // Visual Juice 3: Exhaust Particles
                r.particleTimer++;
                if(r.particleTimer > 8 && r.progress > 0) {
                    particles.push({ x: pos.x + r.laneOffset + r.currentDrift, y: pos.y + r.laneOffset + r.currentDrift, vy: 1 + Math.random(), alpha: 0.7, size: 4 + Math.random()*4 });
                    r.particleTimer = 0;
                }

                if(r.progress >= 0.999) {
                    if(r.lap < maxLaps) { r.lap++; r.progress = 0; } 
                    else { r.finished = true; if(!raceFinished) announceWinner(r); } 
                }
            });

            const leader = [...racers].sort((a,b) => (b.lap * 100 + b.progress) - (a.lap * 100 + a.progress))[0];
            if(leader) document.getElementById('leaderName').innerText = leader.name + " (Lap " + leader.lap + ")";

            draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        function drawCar(r) {
            const drawProgress = Math.max(0, r.progress);
            const pos = getPointOnPath(drawProgress, document.getElementById('trackSelect').value);
            ctx.save();
            // Apply drift and lane offset
            ctx.translate(pos.x + r.laneOffset + r.currentDrift, pos.y + r.laneOffset + r.currentDrift);
            ctx.rotate(pos.angle);
            
            // Car Body
            ctx.fillStyle = r.color; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(10, -8); ctx.lineTo(11, 14); ctx.lineTo(-11, 14); ctx.lineTo(-10, -8); ctx.closePath(); ctx.fill(); 
            ctx.fillStyle = "#111"; // Windshield
            ctx.fillRect(-8, -12, 16, 5); ctx.fillRect(-9, -15, 18, 2);
            ctx.fillStyle = "#222"; ctx.fillRect(-15, 8, 30, 4); // Rear wing
            
            ctx.rotate(-pos.angle);
            ctx.fillStyle = "white"; ctx.font = "bold 13px Inter"; ctx.textAlign = "center"; ctx.shadowBlur = 4; ctx.shadowColor = "black";
            ctx.fillText(r.name, 0, -38);
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = "#166534"; ctx.fillRect(0, 0, canvas.width, canvas.height); // Green background
            drawScenery();
            drawTrack();
            // Draw Particles (Visual Juice 3)
            ctx.fillStyle = "rgba(100,100,100,0.5)";
            particles.forEach(p => { ctx.globalAlpha = p.alpha; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1.0; // Reset
            
            racers.forEach(r => drawCar(r));
        }

        function startCountdown() {
            const div = document.getElementById('countdown'); div.classList.remove('hidden');
            let count = 3;
            const timer = setInterval(() => {
                if(count > 0) { div.innerText = count; count--; }
                else if(count === 0) { div.innerText = "GO!"; count--; startRace(); }
                else { div.classList.add('hidden'); clearInterval(timer); }
            }, 1000);
            document.getElementById('startBtn').classList.add('hidden');
        }

        function startRace() { raceActive = true; raceFinished = false; gameLoop(); }
        window.onload = () => initRaceData();
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; drawScenery(); draw(); };
    </script>
</body>
</html>
