<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>BCE DRONE GP | NEON SKIES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; }
        .admin-panel { background: rgba(2, 6, 23, 0.9); border-bottom: 2px solid #06b6d4; backdrop-filter: blur(10px); }
        select, input { background: #1e293b; border: 1px solid #0891b2; padding: 6px 12px; border-radius: 6px; color: white; outline: none; }
        #countdown { font-size: 140px; font-weight: 900; text-shadow: 0 0 40px #06b6d4; pointer-events: none; }
    </style>
</head>
<body>

    <div class="admin-panel fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center px-8">
        <div class="flex items-center gap-6">
            <h1 class="text-3xl font-black italic uppercase text-cyan-400 tracking-tighter">BCE <span class="text-white">SKY-RACE</span></h1>
            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-cyan-700">Heat</label>
                <input type="number" id="heatSelect" value="1" min="1" class="w-16" onchange="initRaceData()">
            </div>
            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-cyan-700">Laps</label>
                <input type="number" id="totalLaps" value="3" min="1" class="w-16">
            </div>
        </div>

        <div id="raceStats" class="flex gap-8 items-center">
            <div class="text-right">
                <div class="text-[10px] font-bold text-slate-500 uppercase">First Place</div>
                <div id="leaderName" class="text-xl font-black text-cyan-400">---</div>
            </div>
            <button onclick="startCountdown()" id="startBtn" class="bg-cyan-600 px-8 py-3 rounded-md font-bold hover:bg-cyan-500 shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all active:scale-95 uppercase tracking-widest text-sm">Launch Drones</button>
        </div>
    </div>

    <div id="countdown" class="fixed inset-0 flex items-center justify-center z-40 hidden italic uppercase"></div>
    <canvas id="raceCanvas"></canvas>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let racers = [];
        let raceActive = false;
        let raceFinished = false;

        // Hoops/Gates Layout
        const trackGates = [
            {x: 0.2, y: 0.8}, {x: 0.1, y: 0.5}, {x: 0.2, y: 0.2}, 
            {x: 0.5, y: 0.15}, {x: 0.8, y: 0.2}, {x: 0.9, y: 0.5}, 
            {x: 0.8, y: 0.8}, {x: 0.5, y: 0.85}, {x: 0.2, y: 0.8}
        ];

        async function initRaceData() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const selectedHeat = document.getElementById('heatSelect').value;
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getHeat", heat: selectedHeat }) });
                const data = await res.json();
                
                if (!data.racers || data.racers.length === 0) {
                    racers = []; draw(); return;
                }

                racers = data.racers.map((r, i) => {
                    // THRUSTERS (Speed) and GYROS (Handling)
                    let thrust = 0.0012; 
                    let gyro = 0.08; 
                    if(r.motor === "V8 Engine") thrust += 0.0006; // Translate car parts to drone logic
                    if(r.tires === "Slicks") gyro += 0.05;

                    return { 
                        ...r, 
                        progress: 0 - (i * 0.02),
                        lap: 1, 
                        thrust, 
                        gyro,
                        x: 0, y: 0, angle: 0, tilt: 0,
                        laneOffset: (i - (data.racers.length/2)) * 25, 
                        history: [], // For neon trail
                        finished: false, 
                        color: r.color || "#06b6d4"
                    };
                });
                draw();
            } catch (e) { console.error(e); }
        }

        function getPointOnPath(t) {
            const sections = trackGates.length - 1;
            const progress = Math.max(0, Math.min(0.999, t));
            const section = Math.min(Math.floor(progress * sections), sections - 1);
            const sectionT = (progress * sections) - section;
            const p1 = trackGates[section]; const p2 = trackGates[section + 1];
            return { 
                x: (p1.x + (p2.x - p1.x) * sectionT) * canvas.width, 
                y: (p1.y + (p2.y - p1.y) * sectionT) * canvas.height,
                angle: Math.atan2((p2.y - p1.y), (p2.x - p1.x))
            };
        }

        function drawHoops() {
            trackGates.forEach((g, i) => {
                const gx = g.x * canvas.width;
                const gy = g.y * canvas.height;
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = i === 0 ? "#f87171" : "#06b6d4";
                ctx.strokeStyle = i === 0 ? "#ef4444" : "rgba(6, 182, 212, 0.5)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(gx, gy, 40, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
        }

        function gameLoop() {
            if(!raceActive) return;
            const maxLaps = parseInt(document.getElementById('totalLaps').value);

            racers.forEach(r => {
                if(r.finished) return;
                
                const target = getPointOnPath(Math.max(0, r.progress));
                r.x = target.x + (Math.cos(target.angle + Math.PI/2) * r.laneOffset);
                r.y = target.y + (Math.sin(target.angle + Math.PI/2) * r.laneOffset);
                
                // Flight Physics
                r.progress += r.thrust * (0.9 + Math.random() * 0.3);
                r.angle = target.angle;
                
                // Record Trail
                r.history.push({x: r.x, y: r.y});
                if(r.history.length > 20) r.history.shift();

                if(r.progress >= 0.999) {
                    if(r.lap < maxLaps) { r.lap++; r.progress = 0; } 
                    else { r.finished = true; if(!raceFinished) announceWinner(r); } 
                }
            });

            const leader = [...racers].sort((a,b) => (b.lap * 100 + b.progress) - (a.lap * 100 + a.progress))[0];
            if(leader) document.getElementById('leaderName').innerText = leader.name;

            draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        function drawDrone(r) {
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.rotate(r.angle);
            
            // Neon Trail
            ctx.restore();
            if(r.history.length > 2) {
                ctx.beginPath();
                ctx.strokeStyle = r.color;
                ctx.globalAlpha = 0.4;
                ctx.lineWidth = 2;
                r.history.forEach((h, i) => {
                    if(i===0) ctx.moveTo(h.x, h.y);
                    else ctx.lineTo(h.x, h.y);
                });
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            // Drone Body (X-Frame)
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.rotate(r.angle);
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
            ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
            ctx.stroke();
            
            // Motors
            ctx.fillStyle = r.color;
            [-10, 10].forEach(x => [-10, 10].forEach(y => {
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
            }));

            ctx.rotate(-r.angle);
            ctx.fillStyle = "white";
            ctx.font = "bold 12px Inter";
            ctx.textAlign = "center";
            ctx.fillText(r.name, 0, -25);
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Space/Stars background
            ctx.fillStyle = "white";
            for(let i=0; i<100; i++) {
                if(i%10 === 0) ctx.fillRect((i*137)%canvas.width, (i*243)%canvas.height, 1, 1);
            }

            drawHoops();
            racers.forEach(r => drawDrone(r));
        }

        function startCountdown() {
            const div = document.getElementById('countdown'); div.classList.remove('hidden');
            let count = 3;
            const timer = setInterval(() => {
                if(count > 0) { div.innerText = count; count--; }
                else if(count === 0) { div.innerText = "IGNITION"; count--; startRace(); }
                else { div.classList.add('hidden'); clearInterval(timer); }
            }, 1000);
            document.getElementById('startBtn').classList.add('hidden');
        }

        function startRace() { raceActive = true; raceFinished = false; gameLoop(); }
        async function announceWinner(w) {
            raceFinished = true;
            alert(`🚀 MISSION COMPLETE: ${w.name} ARRIVED FIRST!`);
            const prize = document.getElementById('prizeAmt')?.value || 100;
            await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "payoutRace", winnerID: w.id, amount: parseInt(prize) }) });
        }

        window.onload = () => initRaceData();
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; draw(); };
    </script>
</body>
</html>
