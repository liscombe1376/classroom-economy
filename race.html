<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE GRAND PRIX - V2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #064e3b; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; }
        .admin-panel { background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #3b82f6; backdrop-filter: blur(10px); pointer-events: auto; }
        .leaderboard { background: rgba(15, 23, 42, 0.85); border-left: 2px solid #3b82f6; backdrop-filter: blur(5px); }
        .announcer-panel { background: rgba(0, 0, 0, 0.9); border-top: 4px solid #facc15; }
        input { background: #1e293b; border: 1px solid #475569; padding: 4px; border-radius: 4px; color: white; font-size: 0.75rem; }
        #countdown { font-size: 150px; font-weight: 900; text-shadow: 0 0 40px #3b82f6; pointer-events: none; z-index: 100; }
        .stat-card { background: rgba(255,255,255,0.05); border-radius: 4px; padding: 4px 8px; }
    </style>
</head>
<body>

    <div class="admin-panel fixed top-0 left-0 w-full z-50 p-3 flex justify-between items-center px-8 shadow-2xl">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-white">BCE <span class="text-blue-500">GP</span></h1>
            <div class="flex gap-4 items-center">
                <div class="flex flex-col">
                    <label class="text-[9px] uppercase font-bold text-slate-400">Race Config</label>
                    <div class="flex gap-1">
                        <input type="number" id="heatSelect" value="1" class="w-12" onchange="initRaceData()">
                        <input type="number" id="totalLaps" value="3" class="w-12">
                    </div>
                </div>
                <div class="flex flex-col border-l border-slate-700 pl-4">
                    <label class="text-[9px] uppercase font-bold text-slate-400">Track Hazards</label>
                    <div class="flex gap-1">
                        <input type="number" id="hCone" value="10" class="w-10" title="Cones" onchange="updateHazardsLive()">
                        <input type="number" id="hSpike" value="4" class="w-10" title="Spikes" onchange="updateHazardsLive()">
                        <input type="number" id="hOil" value="3" class="w-10" title="Oil" onchange="updateHazardsLive()">
                    </div>
                </div>
                <div class="flex flex-col border-l border-slate-700 pl-4">
                    <label class="text-[9px] uppercase font-bold text-slate-400">Prize Pool ($)</label>
                    <div class="flex gap-1">
                        <input type="number" id="p1" value="150" class="w-14" title="1st">
                        <input type="number" id="p2" value="75" class="w-14" title="2nd">
                        <input type="number" id="p3" value="30" class="w-14" title="3rd">
                    </div>
                </div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleAudio()" id="audioBtn" class="bg-slate-700 px-4 py-2 rounded font-bold text-xs uppercase">Sound: OFF</button>
            <button onclick="startCountdown()" id="startBtn" class="bg-blue-600 px-8 py-2 rounded font-black hover:bg-blue-500 transition-all uppercase tracking-widest text-xs shadow-lg shadow-blue-900/50">Ignition</button>
        </div>
    </div>

    <div class="leaderboard fixed top-[76px] right-0 bottom-16 w-64 z-40 p-4 shadow-2xl overflow-y-auto">
        <h2 class="text-xs font-black text-blue-400 uppercase tracking-widest mb-4 border-b border-blue-900/50 pb-2 flex justify-between">
            <span>Standings</span>
            <span id="lapDisplay">LAP 1</span>
        </h2>
        <div id="leaderList" class="flex flex-col gap-3"></div>
    </div>

    <div class="announcer-panel fixed bottom-0 left-0 w-full h-16 z-50 flex items-center px-10 shadow-2xl">
        <div class="flex items-center w-full max-w-7xl mx-auto">
            <div class="bg-yellow-400 text-black px-4 py-1 font-black italic uppercase text-sm mr-6 skew-x-[-12deg]">Live Feed</div>
            <div id="announcement" class="text-2xl font-black italic text-white tracking-wide uppercase truncate drop-shadow-md">Awaiting Race Signal...</div>
        </div>
    </div>

    <div id="countdown" class="fixed inset-0 flex items-center justify-center hidden italic uppercase text-white"></div>
    <canvas id="raceCanvas"></canvas>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let racers = [], hazards = [], textures = [], scenery = [], particles = [];
        let raceActive = false, raceFinished = false, audioEnabled = false;
        let audioCtx, masterGain;

        const trackPath = [
            {x: 0.5, y: 0.85}, {x: 0.15, y: 0.85}, {x: 0.08, y: 0.4}, {x: 0.25, y: 0.15}, 
            {x: 0.5, y: 0.35}, {x: 0.75, y: 0.15}, {x: 0.92, y: 0.4}, 
            {x: 0.85, y: 0.85}, {x: 0.5, y: 0.85}
        ];

        // --- AUDIO ENGINE ---
        function toggleAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.1;
                masterGain.connect(audioCtx.destination);
            }
            audioEnabled = !audioEnabled;
            document.getElementById('audioBtn').innerText = audioEnabled ? "Sound: ON" : "Sound: OFF";
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playHitSound(freq, type) {
            if (!audioEnabled) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type || 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.2);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(g); g.connect(masterGain);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- CORE LOGIC ---
        function announce(msg) { 
            const el = document.getElementById('announcement');
            el.innerText = msg;
            el.style.transform = "scale(1.05)";
            setTimeout(() => el.style.transform = "scale(1)", 200);
        }

        function createEnvironment() {
            if (textures.length === 0) {
                const colors = ["#14532d", "#064e3b", "#166534", "#052e16"];
                for(let i=0; i<60; i++) textures.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, w: 100+Math.random()*400, h: 80+Math.random()*250, c: colors[Math.floor(Math.random()*colors.length)] + "44" });
                for(let i=0; i<40; i++) scenery.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: 5+Math.random()*20, type: Math.random() > 0.5 ? 'tree' : 'rock' });
            }
            hazards = [];
            const counts = { cones: +document.getElementById('hCone').value, spikes: +document.getElementById('hSpike').value, oil: +document.getElementById('hOil').value };
            Object.entries(counts).forEach(([type, count]) => {
                for(let i=0; i<count; i++) hazards.push({ progress: 0.1 + Math.random()*0.85, lane: Math.floor(Math.random()*6), type, active: true });
            });
        }

        function spawnParticles(x, y, color, count = 5) {
            for(let i=0; i<count; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 1, color });
            }
        }

        function hasPurchasedItem(r, keyword) {
            if (!r) return false;
            const target = keyword.toLowerCase().replace(/\s/g, '');
            return Object.values(r).some(val => {
                if (!val || typeof val !== 'string') return false;
                return val.toLowerCase().replace(/\s/g, '').includes(target);
            });
        }

        async function initRaceData() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            textures = []; scenery = []; createEnvironment();
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getHeat", heat: document.getElementById('heatSelect').value }) });
                const data = await res.json();
                racers = (data.racers || []).map((r, i) => {
                    let b = 0.0011;
                    if (hasPurchasedItem(r, "Electric")) b += 0.00018;
                    if (hasPurchasedItem(r, "V8")) b += 0.00035;
                    if (hasPurchasedItem(r, "V12")) b += 0.00085;
                    if (hasPurchasedItem(r, "Hard Tire")) b += 0.0003;
                    if (hasPurchasedItem(r, "Soft Tire")) b -= 0.0001;
                    if (hasPurchasedItem(r, "Nitro")) b += 0.00045;
                    
                    return {
                        ...r, id: r.StudentID || r.id, progress: 0 - (i*0.015), lap: 1, speedBase: b,
                        currentSpeed: 0, penalty: 0, spin: 0, flats: 0, color: r.color || "#3b82f6",
                        x: 0, y: 0, angle: 0, lane: i, laneOffset: (i - (data.racers.length/2))*16, finished: false
                    };
                });
                announce("Engines Warming Up..."); draw();
            } catch(e) { console.error(e); }
        }

        function gameLoop() {
            if(!raceActive) return;
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) particles.splice(i, 1);
            });

            racers.forEach(r => {
                if(r.finished) return;
                let mod = Math.max(0.1, Math.pow(0.7, r.flats));
                
                if(r.spin > 0) {
                    r.angle += 0.35; r.spin--; r.currentSpeed *= 0.9;
                    spawnParticles(r.x, r.y, "#ffffff22", 1);
                } else {
                    r.currentSpeed = (r.penalty > 0) ? r.speedBase * 0.25 : r.speedBase * mod;
                    if(r.penalty > 0) r.penalty--;
                    const pos = getPointOnPath(Math.max(0, r.progress));
                    r.angle = pos.a;
                    let v = hasPurchasedItem(r, "Soft Tire") ? (0.97 + Math.random()*0.06) : (0.9 + Math.random()*0.2);
                    r.progress += r.currentSpeed * v;
                    r.x = pos.x + Math.cos(pos.a + Math.PI/2)*r.laneOffset;
                    r.y = pos.y + Math.sin(pos.a + Math.PI/2)*r.laneOffset;
                }

                hazards.forEach(h => {
                    if(h.active && h.lane === r.lane && Math.abs(r.progress - h.progress) < 0.008) {
                        if(h.type === 'cones') {
                            if(hasPurchasedItem(r, "Bush Bar") || hasPurchasedItem(r, "Bumper")) {
                                announce(`🛡️ ${r.name} smashed through!`);
                                spawnParticles(r.x, r.y, "#f97316", 8);
                                playHitSound(200, 'sine');
                            } else {
                                r.penalty = 100; announce(`⚠️ ${r.name} hit a cone!`);
                                playHitSound(150);
                            }
                            h.active = false;
                        } else if(h.type === 'spikes') {
                            if(hasPurchasedItem(r, "Self Inflated") || hasPurchasedItem(r, "Armor")) {
                                announce(`🛡️ ${r.name} ignored spikes!`);
                            } else {
                                r.flats++; announce(`💥 ${r.name} popped a tire!`);
                                spawnParticles(r.x, r.y, "#cbd5e1", 12);
                                playHitSound(100, 'sawtooth');
                            }
                            h.active = false;
                        } else if(h.type === 'oil') {
                            if(hasPurchasedItem(r, "Grip")) {
                                announce(`🛡️ ${r.name} steady on oil!`);
                            } else {
                                r.spin = 130; announce(`🌀 ${r.name} spin out!`);
                                spawnParticles(r.x, r.y, "#000000", 15);
                                playHitSound(80);
                            }
                            h.active = false;
                        }
                    }
                });

                if(r.progress >= 0.999) {
                    if(r.lap < +document.getElementById('totalLaps').value) { r.lap++; r.progress = 0; }
                    else { r.finished = true; checkWinner(); }
                }
            });
            updateUI(); draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        function getPointOnPath(t) {
            const sections = trackPath.length - 1;
            const p = Math.max(0, Math.min(0.999, t));
            const sec = Math.floor(p * sections);
            const secT = (p * sections) - sec;
            const p1 = trackPath[sec], p2 = trackPath[sec+1];
            return { x: (p1.x + (p2.x - p1.x)*secT)*(canvas.width-256), y: (p1.y + (p2.y - p1.y)*secT)*canvas.height, a: Math.atan2(p2.y-p1.y, p2.x-p1.x) };
        }

        function draw() {
            ctx.fillStyle = "#166534"; ctx.fillRect(0,0,canvas.width,canvas.height);
            textures.forEach(t => { ctx.fillStyle = t.c; ctx.beginPath(); ctx.ellipse(t.x,t.y,t.w,t.h,0,0,Math.PI*2); ctx.fill(); });
            scenery.forEach(s => {
                ctx.fillStyle = s.type === 'tree' ? "#064e3b" : "#475569";
                ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
            });
            
            const tw = canvas.width - 256;
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 110; ctx.lineJoin = "round"; ctx.lineCap = "round";
            ctx.beginPath(); trackPath.forEach((p,i) => i===0 ? ctx.moveTo(p.x*tw, p.y*canvas.height) : ctx.lineTo(p.x*tw, p.y*canvas.height)); ctx.stroke();
            ctx.strokeStyle = "white"; ctx.lineWidth = 100; ctx.setLineDash([20,20]); ctx.stroke();
            ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 90; ctx.setLineDash([]); ctx.stroke();

            hazards.forEach(h => {
                if(!h.active && h.type !== 'oil') return;
                const pos = getPointOnPath(h.progress);
                const lo = (h.lane - (racers.length || 6)/2) * 16;
                const px = pos.x + Math.cos(pos.a+Math.PI/2)*lo, py = pos.y + Math.sin(pos.a+Math.PI/2)*lo;
                ctx.fillStyle = h.type === 'cones' ? "#f97316" : h.type === 'spikes' ? "#94a3b8" : "#000000";
                ctx.beginPath(); ctx.arc(px,py, h.type==='oil'?15:6, 0, Math.PI*2); ctx.fill();
            });

            particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, 3, 3); ctx.globalAlpha = 1; });

            racers.forEach(r => {
                ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.angle);
                ctx.fillStyle = r.color; ctx.shadowBlur = 10; ctx.shadowColor = "black";
                ctx.roundRect(-14,-8,28,16,4); ctx.fill();
                ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillRect(6,-6,6,12); // Windshield
                ctx.restore();
                ctx.fillStyle = "white"; ctx.font = "bold 12px Inter"; ctx.textAlign = "center"; 
                ctx.fillText(r.name.toUpperCase(), r.x, r.y-22);
            });
        }

        function updateUI() {
            const sorted = [...racers].sort((a,b) => (b.lap*10 + b.progress) - (a.lap*10 + a.progress));
            if(sorted[0]) document.getElementById('lapDisplay').innerText = `LAP ${sorted[0].lap}`;
            document.getElementById('leaderList').innerHTML = sorted.map((r, i) => `
                <div class="stat-card flex items-center gap-3 border-l-4 shadow-sm" style="border-color: ${r.color}">
                    <span class="text-xs font-black text-slate-500 w-4">${i+1}</span>
                    <div class="flex-1 min-w-0">
                        <div class="text-[11px] font-black truncate">${r.name.toUpperCase()}</div>
                        <div class="flex gap-2 text-[9px] font-bold text-slate-400">
                            <span>${r.flats} FLATS</span>
                            <span class="${r.penalty>0?'text-red-500':''}">${r.penalty>0?'SLOWED':'OK'}</span>
                        </div>
                    </div>
                    <div class="text-blue-500 font-black text-xs">L${r.lap}</div>
                </div>
            `).join('');
        }

        async function checkWinner() {
            if(racers.every(r => r.finished) && !raceFinished) {
                raceFinished = true;
                const s = [...racers].sort((a,b) => (b.lap*10 + b.progress) - (a.lap*10 + a.progress));
                const p = [+document.getElementById('p1').value, +document.getElementById('p2').value, +document.getElementById('p3').value];
                announce(`🏆 CHAMPION: ${s[0].name.toUpperCase()}!`);
                for(let i=0; i<3; i++) {
                    if(s[i]) await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "payoutRace", winnerID: s[i].id, amount: p[i] }) });
                }
                alert(`PODIUM\n1st: ${s[0].name} ($${p[0]})\n2nd: ${s[1].name} ($${p[1]})\n3rd: ${s[2].name} ($${p[2]})`);
                document.getElementById('startBtn').classList.remove('hidden');
            }
        }

        function startCountdown() {
            const div = document.getElementById('countdown'); div.classList.remove('hidden');
            let count = 3; document.getElementById('startBtn').classList.add('hidden');
            const timer = setInterval(() => {
                if(count > 0) { div.innerText = count; count--; playHitSound(440, 'triangle'); }
                else { div.innerText = "LIGHTS OUT!"; clearInterval(timer); playHitSound(880, 'sine'); setTimeout(() => div.classList.add('hidden'), 1000); raceActive = true; raceFinished = false; gameLoop(); }
            }, 1000);
        }

        window.onload = () => initRaceData();
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; textures=[]; scenery=[]; createEnvironment(); draw(); };
    </script>
</body>
</html>
