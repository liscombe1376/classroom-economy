<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>BCE GRAND PRIX | LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #131a1c; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; }
        .admin-panel { background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #3b82f6; pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        select, input { background: #1e293b; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; color: white; font-size: 0.85rem; outline: none; }
    </style>
</head>
<body>

    <div class="admin-panel fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center px-8">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-black italic tracking-tighter uppercase text-white">BCE <span class="text-blue-500">GP</span></h1>
            
            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Track</label>
                <select id="trackSelect" onchange="initRaceData()">
                    <option value="pro">Pro Circuit (Balanced)</option>
                    <option value="mud">The Snake (Technical)</option>
                    <option value="oval">The Oval (Speedway)</option>
                    <option value="drag">Drag Strip (Sprint)</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Laps</label>
                <input type="number" id="totalLaps" value="3" min="1" class="w-16">
            </div>

            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Prize ($)</label>
                <input type="number" id="prizeAmt" value="100" class="w-20">
            </div>
        </div>

        <div id="raceStats" class="flex gap-8 items-center">
            <div class="text-right">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Leader</div>
                <div id="leaderName" class="text-xl font-black text-blue-400">---</div>
            </div>
            <button onclick="startRace()" id="startBtn" class="bg-blue-600 px-8 py-3 rounded-md font-bold hover:bg-blue-500 shadow-lg transition-all active:scale-95 uppercase tracking-widest text-sm">Start Race</button>
        </div>
    </div>

    <canvas id="raceCanvas"></canvas>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let racers = [];
        let scenery = [];
        let raceActive = false;
        let raceFinished = false;

        const tracks = {
            pro: [
                {x: 0.15, y: 0.8}, {x: 0.1, y: 0.3}, {x: 0.4, y: 0.2}, 
                {x: 0.5, y: 0.45}, {x: 0.7, y: 0.2}, {x: 0.9, y: 0.3}, 
                {x: 0.85, y: 0.75}, {x: 0.6, y: 0.85}, {x: 0.4, y: 0.6}, {x: 0.15, y: 0.8}
            ],
            mud: [
                {x: 0.2, y: 0.8}, {x: 0.1, y: 0.5}, {x: 0.25, y: 0.2}, 
                {x: 0.5, y: 0.4}, {x: 0.45, y: 0.1}, {x: 0.75, y: 0.2}, 
                {x: 0.65, y: 0.5}, {x: 0.9, y: 0.6}, {x: 0.8, y: 0.9}, 
                {x: 0.5, y: 0.7}, {x: 0.2, y: 0.8}
            ],
            oval: [
                {x: 0.2, y: 0.7}, {x: 0.2, y: 0.3}, {x: 0.4, y: 0.15},
                {x: 0.6, y: 0.15}, {x: 0.8, y: 0.3}, {x: 0.8, y: 0.7}, 
                {x: 0.6, y: 0.85}, {x: 0.4, y: 0.85}, {x: 0.2, y: 0.7}
            ],
            drag: [
                {x: 0.1, y: 0.5}, {x: 0.9, y: 0.5} 
            ]
        };

        function generateScenery() {
            scenery = [];
            for(let i=0; i<40; i++) {
                scenery.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: 10 + Math.random() * 20,
                    type: Math.random() > 0.3 ? 'tree' : 'rock',
                    color: Math.random() > 0.5 ? '#14532d' : '#166534'
                });
            }
        }

        async function initRaceData() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateScenery();
            
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getHeat", heat: 1 })
                });
                const data = await res.json();
                
                racers = data.racers.map((r, i) => {
                    let speed = 1.0;
                    let handling = 1.0;
                    if(r.motor === "V8 Engine") speed += 1.8;
                    if(r.tires === "Slicks") handling += 1.6;

                    return {
                        ...r,
                        progress: 0,
                        lap: 1,
                        speedBase: speed,
                        handlingBase: handling,
                        laneOffset: (i - 1) * 12,
                        finished: false,
                        color: r.color || "#3b82f6"
                    };
                });
                draw();
            } catch (e) { console.error(e); }
        }

        function getPointOnPath(t, trackType) {
            const path = tracks[trackType];
            const sections = path.length - 1;
            const section = Math.min(Math.floor(t * sections), sections - 1);
            const sectionT = (t * sections) - section;
            const p1 = path[section];
            const p2 = path[section + 1];

            return {
                x: (p1.x + (p2.x - p1.x) * sectionT) * canvas.width,
                y: (p1.y + (p2.y - p1.y) * sectionT) * canvas.height,
                angle: Math.atan2((p2.y - p1.y), (p2.x - p1.x)) + Math.PI/2,
                isCorner: (sectionT < 0.2 || sectionT > 0.8) && trackType !== 'drag'
            };
        }

        function drawBackground() {
            // Grass base
            ctx.fillStyle = "#064e3b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Texture
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            for(let i=0; i<200; i++) {
                ctx.fillRect((i*193)%canvas.width, (i*211)%canvas.height, 4, 4);
            }

            scenery.forEach(s => {
                if(s.type === 'tree') {
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "rgba(0,0,0,0.2)"; // Shadow
                    ctx.beginPath(); ctx.arc(s.x+5, s.y+5, s.size, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = "#475569";
                    ctx.beginPath();
                    ctx.roundRect(s.x, s.y, s.size, s.size*0.7, 5);
                    ctx.fill();
                }
            });
        }

        function drawTrack() {
            const type = document.getElementById('trackSelect').value;
            const path = tracks[type];

            // Road Edge (Kerbs)
            ctx.strokeStyle = "white";
            ctx.lineWidth = 90;
            ctx.lineJoin = "round";
            ctx.lineCap = type === 'drag' ? "butt" : "round";
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            path.forEach((p, i) => i === 0 ? ctx.moveTo(p.x*canvas.width, p.y*canvas.height) : ctx.lineTo(p.x*canvas.width, p.y*canvas.height));
            ctx.stroke();

            ctx.strokeStyle = "#ef4444";
            ctx.lineDashOffset = 20;
            ctx.stroke();
            ctx.setLineDash([]);

            // Asphalt
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 80;
            ctx.stroke();

            // Start/Finish Line
            const start = path[0];
            const next = path[1];
            const angle = Math.atan2((next.y - start.y), (next.x - start.x));
            
            ctx.save();
            ctx.translate(start.x * canvas.width, start.y * canvas.height);
            ctx.rotate(angle);
            ctx.fillStyle = "white";
            for(let i=-40; i<40; i+=10) {
                for(let j=0; j<20; j+=10) {
                    if((i+j)%20==0) ctx.fillRect(j-10, i, 10, 10);
                }
            }
            ctx.restore();
        }

        function drawCar(r) {
            const pos = getPointOnPath(r.progress, document.getElementById('trackSelect').value);
            ctx.save();
            ctx.translate(pos.x + r.laneOffset, pos.y + r.laneOffset);
            ctx.rotate(pos.angle);

            // Car Styling
            ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(-10, -5, 20, 30);
            ctx.fillStyle = r.color;
            ctx.beginPath();
            ctx.moveTo(0, -18); ctx.lineTo(10, 12); ctx.lineTo(-10, 12);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = "#000"; ctx.fillRect(-12, 8, 24, 4);

            ctx.rotate(-pos.angle);
            ctx.fillStyle = "white";
            ctx.font = "bold 12px Inter"; ctx.textAlign = "center";
            ctx.fillText(r.name, 0, -35);
            ctx.restore();
        }

        function draw() {
            drawBackground();
            drawTrack();
            racers.forEach(r => drawCar(r));
        }

        function startRace() {
            raceActive = true; raceFinished = false;
            document.getElementById('startBtn').classList.add('hidden');
            gameLoop();
        }

        function gameLoop() {
            if(!raceActive) return;
            const type = document.getElementById('trackSelect').value;
            const maxLaps = parseInt(document.getElementById('totalLaps').value);

            racers.forEach(r => {
                if(r.finished) return;
                const pos = getPointOnPath(r.progress, type);
                let step = 0.0016;
                if(pos.isCorner) step *= (r.handlingBase * 0.7 + Math.random()*0.2);
                else step *= (r.speedBase * 0.9 + Math.random()*0.3);

                r.progress += step;

                if(r.progress >= 0.99) {
                    if(type === 'drag') { r.finished = true; if(!raceFinished) announceWinner(r); }
                    else {
                        if(r.lap < maxLaps) { r.lap++; r.progress = 0; }
                        else { r.finished = true; if(!raceFinished) announceWinner(r); }
                    }
                }
            });

            const leader = [...racers].sort((a,b) => (b.lap * 100 + b.progress) - (a.lap * 100 + a.progress))[0];
            if(leader) document.getElementById('leaderName').innerText = leader.name + " (L" + leader.lap + ")";

            draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        async function announceWinner(w) {
            raceFinished = true;
            const prize = document.getElementById('prizeAmt').value;
            alert("🏁 WINNER: " + w.name + " wins $" + prize + "!");
            await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "payoutRace", winnerID: w.id, amount: parseInt(prize) }) });
        }

        window.onload = () => initRaceData();
    </script>
</body>
</html>
