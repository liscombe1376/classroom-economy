<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>BCE GRAND PRIX | LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        #ui { pointer-events: none; }
        button { pointer-events: auto; }
    </style>
</head>
<body>

    <div id="ui" class="absolute top-10 left-10 z-50">
        <h1 class="text-4xl font-black text-white italic tracking-tighter uppercase">
            BCE Grand Prix <span id="trackName" class="text-blue-500">Pro Circuit</span>
        </h1>
        <button onclick="startRace()" id="startBtn" class="mt-4 bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-500 shadow-2xl transition-all active:scale-95">START ENGINES</button>
    </div>

    <canvas id="raceCanvas"></canvas>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let racers = [];
        let raceActive = false;

        // F1 Style Path (Left and Right turns)
        const trackPath = [
            {x: 0.1, y: 0.8},  // Start Line
            {x: 0.1, y: 0.2},  // Turn 1 (Sharp Left)
            {x: 0.3, y: 0.2},  // Straight
            {x: 0.4, y: 0.5},  // Turn 2 (Right Sweep)
            {x: 0.6, y: 0.5},  // Mid-Straight
            {x: 0.7, y: 0.2},  // Turn 3 (Left Up)
            {x: 0.9, y: 0.2},  // Top Straight
            {x: 0.9, y: 0.8},  // Back Straight
            {x: 0.5, y: 0.8},  // Turn 4 (Infield)
            {x: 0.4, y: 0.7},  // Final Chicane
            {x: 0.1, y: 0.85}  // Finish
        ];

        async function loadHeat(heatNum) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getHeat", heat: heatNum })
            });
            const data = await res.json();
            
            racers = data.racers.map((r, i) => {
                let speed = 1.0;
                let handling = 1.0;
                if(r.motor === "V8 Engine") speed += 1.6;
                if(r.tires === "Slicks") handling += 1.4;

                return {
                    ...r,
                    progress: 0,
                    speedBase: speed,
                    handlingBase: handling,
                    laneOffset: (i - 1) * 8, // Tighter pack for F1 feel
                    finished: false,
                    angle: 0
                };
            });
            draw();
        }

        function getPointOnPath(t) {
            const sections = trackPath.length - 1;
            const section = Math.min(Math.floor(t * sections), sections - 1);
            const sectionT = (t * sections) - section;
            const p1 = trackPath[section];
            const p2 = trackPath[section + 1];

            const dx = (p2.x - p1.x);
            const dy = (p2.y - p1.y);
            const angle = Math.atan2(dy, dx) + Math.PI/2;

            return {
                x: (p1.x + dx * sectionT) * canvas.width,
                y: (p1.y + dy * sectionT) * canvas.height,
                angle: angle,
                isCorner: (sectionT < 0.2 || sectionT > 0.8)
            };
        }

        function drawCar(x, y, angle, color, name) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Car Shadow
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(-8, -12, 16, 28);

            // Body (The color from the Garage sheet)
            ctx.fillStyle = color || "#3b82f6";
            ctx.beginPath();
            ctx.moveTo(0, -18); // Nose
            ctx.lineTo(8, 10);  // Rear Right
            ctx.lineTo(-8, 10); // Rear Left
            ctx.closePath();
            ctx.fill();

            // Spoiler & Details
            ctx.fillStyle = "#111";
            ctx.fillRect(-10, 8, 20, 4); // Rear Wing
            ctx.fillRect(-11, -5, 4, 6); // Front Left Wheel
            ctx.fillRect(7, -5, 4, 6);  // Front Right Wheel

            // Name
            ctx.rotate(-angle); // Keep text horizontal
            ctx.fillStyle = "white";
            ctx.font = "bold 12px Inter";
            ctx.textAlign = "center";
            ctx.fillText(name, 0, -30);
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Asphalt
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 70;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            ctx.beginPath();
            trackPath.forEach((p, i) => {
                if(i === 0) ctx.moveTo(p.x * canvas.width, p.y * canvas.height);
                else ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
            });
            ctx.stroke();

            // White center line
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            racers.forEach(r => {
                const pos = getPointOnPath(r.progress);
                drawCar(pos.x + r.laneOffset, pos.y + r.laneOffset, pos.angle, r.color, r.name);
            });
        }

        function startRace() {
            if(raceActive) return;
            raceActive = true;
            document.getElementById('startBtn').classList.add('hidden');
            gameLoop();
        }

        function gameLoop() {
            if(!raceActive) return;
            let allFinished = true;

            racers.forEach(r => {
                if(r.progress >= 0.99) { r.finished = true; return; }
                allFinished = false;

                const pos = getPointOnPath(r.progress);
                let step = 0.0012; // Base speed
                
                if (pos.isCorner) {
                    step *= (r.handlingBase * 0.6 + (Math.random() * 0.2));
                } else {
                    step *= (r.speedBase * 0.8 + (Math.random() * 0.3));
                }
                r.progress += step;
            });

            draw();
            if(!allFinished) requestAnimationFrame(gameLoop);
            else {
                const winner = racers.sort((a,b) => b.progress - a.progress)[0];
                alert("🏁 CHECKERED FLAG: " + winner.name + " wins!");
            }
        }

        window.onload = () => loadHeat(1);
    </script>
</body>
</html>
