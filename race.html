<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>BCE GRAND PRIX | PRO SCROLL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; }
        .admin-panel { background: rgba(15, 23, 42, 0.9); border-bottom: 2px solid #3b82f6; backdrop-filter: blur(10px); }
        select, input { background: #1e293b; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; color: white; }
        #countdown { font-size: 120px; font-weight: 900; text-shadow: 0 0 30px rgba(59, 130, 246, 0.8); pointer-events: none; }
    </style>
</head>
<body>

    <div class="admin-panel fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center px-8">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-black italic uppercase text-white">BCE <span class="text-blue-500">GP</span></h1>
            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Heat</label>
                <input type="number" id="heatSelect" value="1" min="1" class="w-16" onchange="initRaceData()">
            </div>
            <div class="flex flex-col">
                <label class="text-[10px] uppercase font-bold text-slate-400">Laps</label>
                <input type="number" id="totalLaps" value="2" min="1" class="w-16">
            </div>
        </div>

        <div class="flex gap-8 items-center">
            <div class="text-right">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Leader</div>
                <div id="leaderName" class="text-xl font-black text-blue-400">---</div>
            </div>
            <button onclick="startCountdown()" id="startBtn" class="bg-blue-600 px-8 py-3 rounded-md font-bold hover:bg-blue-500 shadow-lg transition-all active:scale-95 uppercase tracking-widest text-sm">Start Race</button>
        </div>
    </div>

    <div id="countdown" class="fixed inset-0 flex items-center justify-center z-40 hidden italic uppercase"></div>
    <canvas id="raceCanvas"></canvas>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let racers = [];
        let raceActive = false;
        let raceFinished = false;
        let camera = { x: 0, y: 0 };
        
        // Larger World Scale
        const WORLD_WIDTH = 3000;
        const WORLD_HEIGHT = 2000;

        const tracks = {
            pro: [ 
                {x: 0.2, y: 0.8}, {x: 0.1, y: 0.8}, {x: 0.1, y: 0.2}, 
                {x: 0.4, y: 0.1}, {x: 0.6, y: 0.3}, {x: 0.9, y: 0.2}, 
                {x: 0.9, y: 0.8}, {x: 0.6, y: 0.9}, {x: 0.2, y: 0.8}
            ]
        };

        async function initRaceData() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const selectedHeat = document.getElementById('heatSelect').value;
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getHeat", heat: selectedHeat }) });
                const data = await res.json();
                
                if (!data.racers || data.racers.length === 0) {
                    racers = []; draw(); return;
                }

                racers = data.racers.map((r, i) => {
                    let speed = 0.0008; 
                    if(r.motor === "V8 Engine") speed += 0.0004;

                    return { 
                        ...r, 
                        progress: 0 - (i * 0.015),
                        lap: 1, 
                        speedBase: speed, 
                        laneOffset: (i - (data.racers.length/2)) * 18, 
                        finished: false,
                        color: r.color || "#3b82f6",
                        worldX: 0, worldY: 0
                    };
                });
                draw();
            } catch (e) { console.error(e); }
        }

        function getPointOnPath(t) {
            const path = tracks.pro;
            const sections = path.length - 1;
            const progress = Math.max(0, Math.min(0.999, t));
            const section = Math.min(Math.floor(progress * sections), sections - 1);
            const sectionT = (progress * sections) - section;
            const p1 = path[section]; const p2 = path[section + 1];
            
            return { 
                x: (p1.x + (p2.x - p1.x) * sectionT) * WORLD_WIDTH, 
                y: (p1.y + (p2.y - p1.y) * sectionT) * WORLD_HEIGHT, 
                angle: Math.atan2((p2.y - p1.y), (p2.x - p1.x)) + Math.PI/2
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Calculate Camera (Follow Leader)
            let leader = racers.length > 0 ? racers.reduce((prev, curr) => (curr.progress > prev.progress ? curr : prev)) : null;
            if (leader && raceActive) {
                camera.x = leader.worldX - canvas.width / 2;
                camera.y = leader.worldY - canvas.height / 2;
            }

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // 2. Draw World Background
            ctx.fillStyle = "#064e3b";
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
            
            // Subtle Grid
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            for(let x=0; x<WORLD_WIDTH; x+=100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD_HEIGHT); ctx.stroke(); }
            for(let y=0; y<WORLD_HEIGHT; y+=100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD_WIDTH,y); ctx.stroke(); }

            // 3. Draw Track
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 120; ctx.lineJoin = "round"; ctx.lineCap = "round";
            ctx.beginPath();
            tracks.pro.forEach((p, i) => i === 0 ? ctx.moveTo(p.x*WORLD_WIDTH, p.y*WORLD_HEIGHT) : ctx.lineTo(p.x*WORLD_WIDTH, p.y*WORLD_HEIGHT));
            ctx.stroke();

            // Checkered Line
            const start = tracks.pro[0];
            ctx.fillStyle = "white";
            ctx.fillRect(start.x*WORLD_WIDTH - 5, start.y*WORLD_HEIGHT - 60, 10, 120);

            // 4. Draw Cars
            racers.forEach(r => {
                const pos = getPointOnPath(Math.max(0, r.progress));
                r.worldX = pos.x; r.worldY = pos.y;
                
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(pos.angle);
                
                // Car Body
                ctx.fillStyle = r.color;
                ctx.fillRect(-10, -18, 20, 36);
                ctx.fillStyle = "black"; // Windshield
                ctx.fillRect(-8, -12, 16, 6);
                
                ctx.rotate(-pos.angle);
                ctx.fillStyle = "white";
                ctx.font = "bold 14px Inter";
                ctx.textAlign = "center";
                ctx.fillText(r.name, 0, -30);
                ctx.restore();
            });

            ctx.restore();
        }

        function gameLoop() {
            if(!raceActive) return;
            const maxLaps = parseInt(document.getElementById('totalLaps').value);
            let leader = racers.reduce((prev, curr) => (curr.progress > prev.progress ? curr : prev));

            racers.forEach(r => {
                if(r.finished) return;

                // Rubber-banding: If car is very far behind leader, give tiny boost
                let distToLeader = leader.progress - r.progress;
                let boost = distToLeader > 0.1 ? 1.2 : 1.0;

                r.progress += r.speedBase * (0.8 + Math.random() * 0.4) * boost;

                if(r.progress >= 0.999) {
                    if(r.lap < maxLaps) { r.lap++; r.progress = 0; } 
                    else { r.finished = true; if(!raceFinished) announceWinner(r); } 
                }
            });

            if(leader) document.getElementById('leaderName').innerText = `${leader.name} (L${leader.lap})`;

            draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        async function announceWinner(w) {
            raceFinished = true;
            alert(`🏁 ${w.name} TAKES THE WIN!`);
            const prize = document.getElementById('prizeAmt')?.value || 100;
            await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "payoutRace", winnerID: w.id, amount: parseInt(prize) }) });
        }

        function startCountdown() {
            const div = document.getElementById('countdown');
            div.classList.remove('hidden');
            let count = 3;
            const timer = setInterval(() => {
                if(count > 0) { div.innerText = count; count--; }
                else if(count === 0) { div.innerText = "GO!"; count--; startRace(); }
                else { div.classList.add('hidden'); clearInterval(timer); }
            }, 1000);
            document.getElementById('startBtn').classList.add('hidden');
        }

        function startRace() { raceActive = true; raceFinished = false; gameLoop(); }
        window.onload = () => initRaceData();
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; draw(); };
    </script>
</body>
</html>
