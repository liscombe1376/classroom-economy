<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE GRAND PRIX - RACE CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #064e3b; margin: 0; overflow-x: hidden; overflow-y: auto; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; background: #064e3b; width: 100%; height: 600px; border-bottom: 4px solid #1e293b; }
        
        .admin-panel { background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #3b82f6; backdrop-filter: blur(10px); }
        .leaderboard { background: rgba(15, 23, 42, 0.85); border-left: 2px solid #3b82f6; backdrop-filter: blur(5px); }
        .announcer-panel { background: rgba(0, 0, 0, 0.9); border-top: 4px solid #facc15; }
        .management-section { background: #0f172a; padding: 40px; }
        
        /* 3-Column Responsive Grid */
        .student-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 15px; 
        }
        .student-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .student-card:hover { border-color: #3b82f6; background: #232f44; }

        input, select { background: #0f172a; border: 1px solid #475569; padding: 6px; border-radius: 6px; color: white; outline: none; }
        #countdown { font-size: 160px; font-weight: 900; text-shadow: 0 0 40px #3b82f6; pointer-events: none; z-index: 100; }
        
        .stat-label { font-size: 8px; font-weight: 900; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; }
    </style>
</head>
<body>

    <div class="admin-panel sticky top-0 left-0 w-full z-50 p-4 flex justify-between items-center px-10 shadow-2xl">
        <div class="flex items-center gap-8">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">BCE <span class="text-blue-500">GP</span></h1>
            
            <div class="flex gap-6">
                <div class="flex flex-col">
                    <span class="stat-label">Race Setup</span>
                    <div class="flex gap-2">
                        <input type="number" id="heatSelect" value="1" class="w-14 text-center font-bold text-blue-400" onchange="initRaceData()">
                        <input type="number" id="totalLaps" value="3" class="w-14 text-center" title="Laps">
                    </div>
                </div>

                <div class="flex flex-col border-l border-slate-700 pl-6">
                    <span class="stat-label">Track Hazards</span>
                    <div class="flex gap-2">
                        <input type="number" id="hCone" value="8" class="w-12 text-xs" title="Cones" onchange="updateHazardsLive()">
                        <input type="number" id="hSpike" value="3" class="w-12 text-xs" title="Spikes" onchange="updateHazardsLive()">
                        <input type="number" id="hOil" value="2" class="w-12 text-xs" title="Oil" onchange="updateHazardsLive()">
                    </div>
                </div>

                <div class="flex flex-col border-l border-slate-700 pl-6">
                    <span class="stat-label">Prize Pool</span>
                    <div class="flex gap-2">
                        <input type="number" id="p1" value="100" class="w-16 text-xs text-yellow-400" title="1st">
                        <input type="number" id="p2" value="50" class="w-16 text-xs text-slate-300" title="2nd">
                    </div>
                </div>
            </div>
        </div>

        <button onclick="startCountdown()" id="startBtn" class="bg-blue-600 hover:bg-blue-500 px-10 py-3 rounded-lg font-black uppercase tracking-widest text-sm transition-all active:scale-95 shadow-lg shadow-blue-600/20">
            Launch Heat
        </button>
    </div>

    <div class="relative">
        <div id="countdown" class="fixed inset-0 flex items-center justify-center hidden italic uppercase text-white"></div>
        
        <div class="leaderboard absolute top-6 right-0 bottom-6 w-64 z-40 p-5 shadow-2xl rounded-l-2xl border-l border-blue-500/40">
            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 border-b border-slate-700 pb-2 flex justify-between">
                <span>Standings</span>
                <span class="text-blue-500 animate-pulse">LIVE</span>
            </h2>
            <div id="leaderList" class="flex flex-col gap-3"></div>
        </div>

        <canvas id="raceCanvas"></canvas>
    </div>

    <div class="announcer-panel sticky bottom-0 w-full h-20 z-50 flex items-center px-12 shadow-2xl">
        <div class="bg-yellow-400 text-black px-4 py-1 font-black italic uppercase text-xs rounded mr-6 shadow-lg">Race Comms</div>
        <div id="announcement" class="text-2xl font-black italic text-white tracking-tight uppercase truncate">System Ready. Awaiting Driver Check-in...</div>
    </div>

    <div class="management-section">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-12 border-b border-slate-800 pb-8">
                <div>
                    <h2 class="text-4xl font-black italic uppercase tracking-tighter">Race <span class="text-blue-500">Control</span></h2>
                    <p class="text-slate-400 mt-2 font-medium">Assign students to heats. Data syncs directly with the Garage Sheet.</p>
                </div>
                <div class="flex gap-4 bg-slate-900/80 p-5 rounded-2xl border border-slate-700 shadow-xl">
                    <div class="flex flex-col">
                        <span class="stat-label mb-1">Max Heats</span>
                        <input type="number" id="targetHeats" value="4" class="w-24 h-12 text-center text-xl font-black">
                    </div>
                    <button onclick="autoAssignHeats()" class="bg-slate-700 hover:bg-slate-600 px-6 rounded-lg font-bold text-xs uppercase h-12 transition-colors">Randomize</button>
                    <button onclick="saveHeatsToSheet()" id="saveBtn" class="bg-blue-600 hover:bg-blue-500 px-8 rounded-lg font-black text-xs uppercase h-12 transition-all shadow-lg shadow-blue-500/30">Save to Cloud</button>
                </div>
            </div>

            <div id="studentGrid" class="student-grid"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let allStudents = []; 
        let racers = [], hazards = [], textures = [], scenery = [];
        let raceActive = false, raceFinished = false;

        const trackPath = [
            {x: 0.5, y: 0.85}, {x: 0.2, y: 0.85}, {x: 0.1, y: 0.3}, {x: 0.3, y: 0.15}, 
            {x: 0.6, y: 0.4}, {x: 0.8, y: 0.15}, {x: 0.9, y: 0.5}, 
            {x: 0.8, y: 0.85}, {x: 0.5, y: 0.85}
        ];

        function announce(msg) { document.getElementById('announcement').innerText = msg; }

        async function loadStudentList() {
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getStudents" }) });
                allStudents = await res.json();
                renderStudentGrid();
            } catch(e) { console.error("Lookup Error", e); }
        }

        function renderStudentGrid() {
            const grid = document.getElementById('studentGrid');
            grid.innerHTML = allStudents.map(s => `
                <div class="student-card">
                    <div class="flex flex-col">
                        <span class="text-[10px] text-blue-500 font-black tracking-widest">RACER</span>
                        <span class="font-bold text-white text-lg truncate">${s.Name || s.name || "Unknown"}</span>
                    </div>
                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-700">
                        <span class="stat-label block text-center mb-1">Heat</span>
                        <input type="number" value="${s.heat || 0}" 
                               class="w-12 text-center font-black bg-transparent border-none text-blue-400 text-lg" 
                               onchange="updateLocalHeat('${s.id}', this.value)">
                    </div>
                </div>
            `).join('');
        }

        function updateLocalHeat(id, val) {
            const student = allStudents.find(s => s.id == id);
            if(student) student.heat = parseInt(val);
        }

        function autoAssignHeats() {
            const numHeats = parseInt(document.getElementById('targetHeats').value) || 1;
            const shuffled = [...allStudents].sort(() => 0.5 - Math.random());
            shuffled.forEach((s, i) => { s.heat = (i % numHeats) + 1; });
            renderStudentGrid();
        }

        async function saveHeatsToSheet() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "SYNCING...";
            try {
                await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "updateBulkHeats", assignments: allStudents }) });
                btn.innerText = "SAVE TO CLOUD";
                initRaceData(); 
                alert("Cloud Sync Complete!");
            } catch(e) { alert("Sync Error!"); btn.innerText = "SAVE TO CLOUD"; }
        }

        function createEnvironment() {
            if (textures.length === 0) {
                const colors = ["#14532d", "#064e3b", "#3f6212"];
                for(let i=0; i<45; i++) {
                    textures.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, w: 150+Math.random()*300, h: 100+Math.random()*200, c: colors[Math.floor(Math.random()*colors.length)] + "44" });
                }
                for(let i=0; i<30; i++) {
                    scenery.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: 10+Math.random()*20 });
                }
            }
            hazards = [];
            const counts = { cones: parseInt(document.getElementById('hCone').value) || 0, spikes: parseInt(document.getElementById('hSpike').value) || 0, oil: parseInt(document.getElementById('hOil').value) || 0 };
            Object.entries(counts).forEach(([type, count]) => {
                for(let i=0; i<count; i++) { hazards.push({ progress: 0.15 + Math.random()*0.8, lane: Math.floor(Math.random()*6), type: type, active: true }); }
            });
        }

        function updateHazardsLive() { createEnvironment(); draw(); }

        // Aggressive Search for Upgrades in columns
        function hasItem(r, keyword) {
            const kw = keyword.toLowerCase();
            return Object.values(r).some(v => v && String(v).toLowerCase().includes(kw));
        }

        async function initRaceData() {
            canvas.width = window.innerWidth; canvas.height = 600;
            textures = []; scenery = [];
            createEnvironment();
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getHeat", heat: document.getElementById('heatSelect').value }) });
                const data = await res.json();
                racers = (data.racers || []).map((r, i) => {
                    let base = 0.0011;
                    if (hasItem(r, "V12")) base += 0.0008;
                    else if (hasItem(r, "V8")) base += 0.0003;
                    if (hasItem(r, "Nitro")) base += 0.0004;
                    if (hasItem(r, "Electric")) base += 0.0002;

                    return {
                        ...r, 
                        name: r.Name || r.name || "Unknown Racer", // This fixes your Name issue
                        progress: 0 - (i*0.018), lap: 1, speedBase: base, currentSpeed: 0, penalty: 0, spinFrames: 0, flats: 0, x: 0, y: 0, angle: 0, 
                        lane: i, laneOffset: (i - (data.racers.length/2))*16, finished: false,
                        color: r.color || "#3b82f6",
                        hasBushBar: hasItem(r, "Bush"),
                        hasSpikeShield: hasItem(r, "Shield") || hasItem(r, "Inflate") || hasItem(r, "Spare"),
                        hasGrip: hasItem(r, "Grip") || hasItem(r, "Aero"),
                        hasSoftTires: hasItem(r, "Soft")
                    }
                });
                announce("Heats Loaded. Drivers reported to grid.");
                draw();
            } catch(e) { console.error(e); }
        }

        function gameLoop() {
            if(!raceActive) return;
            racers.forEach(r => {
                if(r.finished) return;
                let speedMod = Math.pow(0.75, r.flats);
                
                hazards.forEach(h => {
                    if(h.active && h.lane === r.lane && Math.abs(r.progress - h.progress) < 0.007) {
                        if(h.type === 'cones') {
                            if (r.hasBushBar) { h.active = false; announce(`🛡️ ${r.name.toUpperCase()} RAMMED CONE!`); }
                            else { r.penalty = 120; h.active = false; announce(`⚠️ ${r.name.toUpperCase()} HIT CONE!`); }
                        } else if(h.type === 'spikes') {
                            if (r.hasSpikeShield) { h.active = false; announce(`🛡️ ${r.name.toUpperCase()} SHIELDED!`); }
                            else { r.flats++; h.active = false; announce(`💥 ${r.name.toUpperCase()} POPPED TIRE!`); }
                        } else if(h.type === 'oil') {
                            if (r.hasGrip) { h.active = false; announce(`🛡️ ${r.name.toUpperCase()} STUCK THE LANDING!`); }
                            else { r.spinFrames = 120; h.active = false; announce(`🌀 ${r.name.toUpperCase()} SLIPPED!`); }
                        }
                    }
                });

                if(r.spinFrames > 0) { r.currentSpeed = 0; r.angle += 0.5; r.spinFrames--; } 
                else {
                    r.currentSpeed = (r.penalty > 0) ? r.speedBase * 0.3 * speedMod : r.speedBase * speedMod;
                    if(r.penalty > 0) r.penalty--;
                    const pos = getPointOnPath(Math.max(0, r.progress));
                    r.angle = pos.a;
                    r.progress += r.currentSpeed * (r.hasSoftTires ? (0.98 + Math.random()*0.05) : (0.92 + Math.random()*0.15));
                    r.x = pos.x + Math.cos(pos.a + Math.PI/2)*r.laneOffset;
                    r.y = pos.y + Math.sin(pos.a + Math.PI/2)*r.laneOffset;
                }

                if(r.progress >= 0.999) {
                    if(r.lap < parseInt(document.getElementById('totalLaps').value)) { r.lap++; r.progress = 0; }
                    else { r.finished = true; checkWinner(); }
                }
            });
            updateUI(); draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        function getPointOnPath(t) {
            const sections = trackPath.length - 1;
            const p = Math.max(0, Math.min(0.999, t));
            const sec = Math.floor(p * sections);
            const secT = (p * sections) - sec;
            const p1 = trackPath[sec], p2 = trackPath[sec+1] || trackPath[0];
            const tw = canvas.width - 260;
            return { x: (p1.x + (p2.x - p1.x)*secT)*tw, y: (p1.y + (p2.y - p1.y)*secT)*canvas.height, a: Math.atan2(p2.y-p1.y, p2.x-p1.x) };
        }

        function draw() {
            ctx.fillStyle = "#14532d"; ctx.fillRect(0,0,canvas.width,canvas.height);
            textures.forEach(t => { ctx.fillStyle = t.c; ctx.beginPath(); ctx.ellipse(t.x,t.y,t.w,t.h,0,0,Math.PI*2); ctx.fill(); });
            
            const tw = canvas.width - 260;
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 120; ctx.lineJoin = "round"; ctx.lineCap = "round";
            ctx.beginPath(); trackPath.forEach((p,i) => i===0 ? ctx.moveTo(p.x*tw, p.y*canvas.height) : ctx.lineTo(p.x*tw, p.y*canvas.height)); ctx.stroke();
            ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 100; ctx.stroke();

            hazards.forEach(h => {
                if(!h.active && h.type !== 'oil') return;
                const pos = getPointOnPath(h.progress);
                const lo = (h.lane - (racers.length / 2)) * 16;
                const px = pos.x + Math.cos(pos.a+Math.PI/2)*lo, py = pos.y + Math.sin(pos.a+Math.PI/2)*lo;
                if(h.type === 'cones') { ctx.fillStyle = "#f97316"; ctx.beginPath(); ctx.moveTo(px,py-10); ctx.lineTo(px+8,py+10); ctx.lineTo(px-8,py+10); ctx.fill(); }
                else if(h.type === 'spikes') { ctx.fillStyle = "#94a3b8"; ctx.fillRect(px-12, py+2, 24, 4); }
                else if(h.type === 'oil') { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI*2); ctx.fill(); }
            });

            racers.forEach(r => {
                ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.angle);
                ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(-14, -8, 32, 20); // Shadow
                ctx.fillStyle = r.color; ctx.beginPath(); ctx.roundRect(-16,-10,32,20,5); ctx.fill();
                if(r.hasBushBar) { ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 4; ctx.strokeRect(-16,-10,32,20); }
                ctx.restore(); 
                ctx.fillStyle = "white"; ctx.font = "black 13px Inter"; ctx.textAlign = "center"; 
                ctx.fillText(r.name.toUpperCase(), r.x, r.y-28);
            });
        }

        function updateUI() {
            const sorted = [...racers].sort((a,b) => (b.lap*10 + b.progress) - (a.lap*10 + a.progress));
            document.getElementById('leaderList').innerHTML = sorted.map((r, i) => `
                <div class="flex items-center gap-3 bg-slate-800/90 p-3 rounded-xl border-l-4 shadow-md transition-all" style="border-color: ${r.color}">
                    <span class="font-black text-slate-500 w-4">${i+1}</span>
                    <div class="flex-1 truncate font-black text-xs text-white uppercase">${r.name}</div>
                    <div class="bg-blue-600/20 px-2 py-1 rounded text-[10px] text-blue-400 font-black">L${r.lap}</div>
                </div>
            `).join('');
        }

        async function checkWinner() {
            if(racers.every(r => r.finished) && !raceFinished) {
                raceFinished = true;
                const s = [...racers].sort((a,b) => b.progress - a.progress);
                announce(`🏁 CHECKERED FLAG: ${s[0].name.toUpperCase()} WINS!`);
                
                // Optional Payouts
                const p = [document.getElementById('p1').value, document.getElementById('p2').value];
                for(let i=0; i<2; i++) { if(s[i] && s[i].id) await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "payoutRace", winnerID: s[i].id, amount: parseInt(p[i]) }) }); }

                alert(`WINNER: ${s[0].name}\n2ND: ${s[1] ? s[1].name : 'N/A'}`);
                document.getElementById('startBtn').classList.remove('hidden');
            }
        }

        function startCountdown() {
            const div = document.getElementById('countdown'); div.classList.remove('hidden');
            let count = 3; document.getElementById('startBtn').classList.add('hidden');
            const timer = setInterval(() => {
                if(count > 0) { div.innerText = count--; } 
                else { div.innerText = "GO!"; clearInterval(timer); setTimeout(() => div.classList.add('hidden'), 1000); raceActive = true; gameLoop(); }
            }, 1000);
        }
        
        window.onload = () => { initRaceData(); loadStudentList(); };
        window.onresize = () => { canvas.width = window.innerWidth; draw(); };
    </script>
</body>
</html>
