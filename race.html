<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>BCE GRAND PRIX | LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        #ui { pointer-events: none; }
        button { pointer-events: auto; }
    </style>
</head>
<body>

    <div id="ui" class="absolute top-10 left-10 z-50">
        <h1 class="text-4xl font-black text-white italic tracking-tighter uppercase">
            BCE Grand Prix: <span id="trackName">Circuit</span>
        </h1>
        <div class="flex gap-2 mt-2">
            <button onclick="setTrack('drag')" class="bg-slate-700 text-white px-4 py-1 rounded text-xs font-bold hover:bg-slate-600">DRAG STRIP</button>
            <button onclick="setTrack('circuit')" class="bg-slate-700 text-white px-4 py-1 rounded text-xs font-bold hover:bg-slate-600">CIRCUIT</button>
        </div>
        <button onclick="startRace()" id="startBtn" class="mt-4 bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-500 shadow-xl">START ENGINES</button>
    </div>

    <canvas id="raceCanvas"></canvas>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let racers = [];
        let raceActive = false;
        let currentTrack = 'circuit';

        // Track Definitions (Points car follows)
        const tracks = {
            drag: [
                {x: 0.5, y: 0.9}, // Start bottom middle
                {x: 0.5, y: 0.1}  // End top middle
            ],
            circuit: [
                {x: 0.2, y: 0.8}, // Start
                {x: 0.2, y: 0.2}, // Turn 1
                {x: 0.8, y: 0.2}, // Turn 2
                {x: 0.8, y: 0.8}, // Turn 3
                {x: 0.2, y: 0.82} // Finish (just past start)
            ]
        };

        function setTrack(type) {
            currentTrack = type;
            document.getElementById('trackName').innerText = type.toUpperCase();
            loadHeat(1);
        }

        async function loadHeat(heatNum) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getHeat", heat: heatNum })
            });
            const data = await res.json();
            
            racers = data.racers.map((r) => {
                // Determine Stats
                let speed = 1.5;
                let handling = 1.0;

                if(r.motor === "V8 Engine") speed += 1.2;
                if(r.motor === "Electric") speed += 0.5;
                if(r.tires === "Slicks") handling += 1.5;

                return {
                    ...r,
                    progress: 0,
                    x: 0,
                    y: 0,
                    speedBase: speed,
                    handlingBase: handling,
                    finished: false
                };
            });
            draw();
        }

        function getPointOnPath(trackType, t) {
            const path = tracks[trackType];
            const sections = path.length - 1;
            const section = Math.min(Math.floor(t * sections), sections - 1);
            const sectionT = (t * sections) - section;
            
            const p1 = path[section];
            const p2 = path[section + 1];
            
            return {
                x: (p1.x + (p2.x - p1.x) * sectionT) * canvas.width,
                y: (p1.y + (p2.y - p1.y) * sectionT) * canvas.height,
                isCorner: (sectionT < 0.2 || sectionT > 0.8) && trackType !== 'drag'
            };
        }

        function draw() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Track Lines
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 60;
            ctx.lineJoin = "round";
            ctx.beginPath();
            tracks[currentTrack].forEach((p, i) => {
                if(i === 0) ctx.moveTo(p.x * canvas.width, p.y * canvas.height);
                else ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
            });
            ctx.stroke();

            // Draw Racers
            racers.forEach(r => {
                const pos = getPointOnPath(currentTrack, r.progress);
                
                // Draw Car
                ctx.fillStyle = r.color || "#3b82f6";
                ctx.fillRect(pos.x - 10, pos.y - 15, 20, 30);
                
                // Draw Name
                ctx.fillStyle = "white";
                ctx.font = "bold 12px Inter";
                ctx.textAlign = "center";
                ctx.fillText(r.name, pos.x, pos.y - 25);
            });
        }

        function startRace() {
            if(raceActive) return;
            raceActive = true;
            document.getElementById('startBtn').classList.add('hidden');
            gameLoop();
        }

        function gameLoop() {
            if(!raceActive) return;

            racers.forEach(r => {
                if(r.progress >= 1) {
                    if(!r.finished) {
                        r.finished = true;
                        checkWinner(r);
                    }
                    return;
                }

                const pos = getPointOnPath(currentTrack, r.progress);
                
                // MATH: Speed vs Handling
                let currentStep = 0.001; 
                if (pos.isCorner) {
                    currentStep *= (r.handlingBase + (Math.random() * 0.5));
                } else {
                    currentStep *= (r.speedBase + (Math.random() * 0.8));
                }

                r.progress += currentStep;
            });

            draw();
            if(racers.some(r => !r.finished)) {
                requestAnimationFrame(gameLoop);
            }
        }

        function checkWinner(winner) {
            raceActive = false;
            alert("🥇 WINNER: " + winner.name);
            // Optional: Send payout to Google Script here
        }

        window.onload = () => loadHeat(1);
    </script>
</body>
</html>
