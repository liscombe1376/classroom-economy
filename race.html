<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE GRAND PRIX - FINAL FIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #064e3b; margin: 0; overflow: hidden; overflow-y: auto; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; background: #064e3b; width: 100%; height: 600px; border-bottom: 4px solid #1e293b; }
        .admin-panel { background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #3b82f6; backdrop-filter: blur(10px); }
        .leaderboard { background: rgba(15, 23, 42, 0.85); border-left: 2px solid #3b82f6; backdrop-filter: blur(5px); }
        .announcer-panel { background: rgba(0, 0, 0, 0.9); border-top: 4px solid #facc15; }
        .management-section { background: #0f172a; padding: 40px; }
        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .student-card { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        input { background: #0f172a; border: 1px solid #475569; padding: 6px; border-radius: 6px; color: white; outline: none; }
        #countdown { font-size: 160px; font-weight: 900; text-shadow: 0 0 40px #3b82f6; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

    <div class="admin-panel sticky top-0 left-0 w-full z-50 p-4 flex justify-between items-center px-10">
        <div class="flex items-center gap-8">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter text-white">BCE <span class="text-blue-500">GP</span></h1>
            <div class="flex gap-4">
                <input type="number" id="heatSelect" value="1" class="w-16 text-center font-bold text-blue-400" onchange="initRaceData()">
                <span class="text-slate-500 font-bold self-center">HEAT</span>
            </div>
        </div>
        <button onclick="startCountdown()" id="startBtn" class="bg-blue-600 px-10 py-3 rounded-lg font-black uppercase tracking-widest text-sm shadow-lg">Start Race</button>
    </div>

    <div class="relative">
        <div id="countdown" class="fixed inset-0 flex items-center justify-center hidden italic uppercase text-white"></div>
        <div class="leaderboard absolute top-6 right-0 bottom-6 w-64 z-40 p-5 shadow-2xl rounded-l-2xl border-l border-blue-500/40">
            <h2 class="text-[11px] font-black text-slate-400 uppercase mb-4 border-b border-slate-700 pb-2">Live Standings</h2>
            <div id="leaderList" class="flex flex-col gap-3"></div>
        </div>
        <canvas id="raceCanvas"></canvas>
    </div>

    <div class="announcer-panel sticky bottom-0 w-full h-20 z-50 flex items-center px-12">
        <div id="announcement" class="text-2xl font-black italic text-white tracking-tight uppercase truncate">Awaiting Heat...</div>
    </div>

    <div class="management-section">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-8 border-b border-slate-800 pb-6">
                <h2 class="text-4xl font-black italic uppercase tracking-tighter">Garage <span class="text-blue-500">Sync</span></h2>
                <button onclick="saveHeatsToSheet()" id="saveBtn" class="bg-blue-600 px-8 py-3 rounded-lg font-black text-xs uppercase shadow-lg">Save to Cloud</button>
            </div>
            <div id="studentGrid" class="student-grid"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let allStudents = [], racers = [], hazards = [], textures = [];
        let raceActive = false, raceFinished = false;

        const trackPath = [{x: 0.5, y: 0.85}, {x: 0.2, y: 0.85}, {x: 0.1, y: 0.3}, {x: 0.3, y: 0.15}, {x: 0.6, y: 0.4}, {x: 0.8, y: 0.15}, {x: 0.9, y: 0.5}, {x: 0.8, y: 0.85}, {x: 0.5, y: 0.85}];

        function announce(msg) { document.getElementById('announcement').innerText = msg; }

        // NEW SMART LOOKUP: Finds the name even if columns are shifted
        function getSmartName(r) {
            const possibleKeys = ["Name", "name", "DisplayName", "Student"];
            for (let key of possibleKeys) { if (r[key]) return r[key]; }
            
            // If those fail, look for any string that isn't an ID or a Hex Color
            const values = Object.values(r);
            for (let val of values) {
                if (typeof val === 'string' && val.length > 2 && !val.startsWith('#') && isNaN(val)) {
                    return val;
                }
            }
            return "Racer";
        }

        async function loadStudentList() {
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getStudents" }) });
                allStudents = await res.json();
                renderStudentGrid();
            } catch(e) { console.error(e); }
        }

        function renderStudentGrid() {
            const grid = document.getElementById('studentGrid');
            grid.innerHTML = allStudents.map(s => `
                <div class="student-card">
                    <div class="flex flex-col">
                        <span class="font-bold text-white text-lg">${getSmartName(s)}</span>
                        <span class="text-[10px] text-slate-500 font-bold">${s.id || "No ID"}</span>
                    </div>
                    <input type="number" value="${s.heat || 0}" class="w-12 text-center font-black text-blue-400" onchange="updateLocalHeat('${s.id}', this.value)">
                </div>
            `).join('');
        }

        function updateLocalHeat(id, val) {
            const student = allStudents.find(s => s.id == id);
            if(student) student.heat = parseInt(val);
        }

        async function saveHeatsToSheet() {
            document.getElementById('saveBtn').innerText = "SAVING...";
            await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "updateBulkHeats", assignments: allStudents }) });
            document.getElementById('saveBtn').innerText = "SAVE TO CLOUD";
            initRaceData();
        }

        function hasItem(r, keyword) {
            const kw = keyword.toLowerCase();
            return Object.values(r).some(v => v && String(v).toLowerCase().includes(kw));
        }

        async function initRaceData() {
            canvas.width = window.innerWidth; canvas.height = 600;
            textures = [];
            const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getHeat", heat: document.getElementById('heatSelect').value }) });
            const data = await res.json();
            racers = (data.racers || []).map((r, i) => {
                let base = 0.0011;
                if (hasItem(r, "V12")) base += 0.0008;
                if (hasItem(r, "Electric")) base += 0.0002;
                return {
                    ...r,
                    name: getSmartName(r),
                    progress: 0 - (i*0.02), lap: 1, speedBase: base, currentSpeed: 0, penalty: 0, spinFrames: 0, flats: 0, x: 0, y: 0, angle: 0, 
                    lane: i, laneOffset: (i - (data.racers.length/2))*16, finished: false,
                    color: r.Colour || r.Color || r.color || "#3b82f6",
                    hasBushBar: hasItem(r, "Bush"),
                    hasSpikeShield: hasItem(r, "Self") || hasItem(r, "Shield")
                }
            });
            announce("Grid ready for Heat " + document.getElementById('heatSelect').value);
            draw();
        }

        function gameLoop() {
            if(!raceActive) return;
            racers.forEach(r => {
                if(r.finished) return;
                r.currentSpeed = (r.penalty > 0) ? r.speedBase * 0.4 : r.speedBase;
                const pos = getPointOnPath(Math.max(0, r.progress));
                r.angle = pos.a;
                r.progress += r.currentSpeed * (0.95 + Math.random()*0.1);
                r.x = pos.x + Math.cos(pos.a + Math.PI/2)*r.laneOffset;
                r.y = pos.y + Math.sin(pos.a + Math.PI/2)*r.laneOffset;
                if(r.progress >= 0.999) {
                    if(r.lap < parseInt(document.getElementById('totalLaps').value)) { r.lap++; r.progress = 0; }
                    else { r.finished = true; checkWinner(); }
                }
            });
            updateUI(); draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        function getPointOnPath(t) {
            const sections = trackPath.length - 1;
            const p = Math.max(0, Math.min(0.999, t));
            const sec = Math.floor(p * sections);
            const secT = (p * sections) - sec;
            const p1 = trackPath[sec], p2 = trackPath[sec+1] || trackPath[0];
            const tw = canvas.width - 260;
            return { x: (p1.x + (p2.x - p1.x)*secT)*tw, y: (p1.y + (p2.y - p1.y)*secT)*canvas.height, a: Math.atan2(p2.y-p1.y, p2.x-p1.x) };
        }

        function draw() {
            ctx.fillStyle = "#14532d"; ctx.fillRect(0,0,canvas.width,canvas.height);
            const tw = canvas.width - 260;
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 110; ctx.lineJoin = "round"; ctx.lineCap = "round";
            ctx.beginPath(); trackPath.forEach((p,i) => i===0 ? ctx.moveTo(p.x*tw, p.y*canvas.height) : ctx.lineTo(p.x*tw, p.y*canvas.height)); ctx.stroke();
            racers.forEach(r => {
                ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.angle);
                ctx.fillStyle = r.color; ctx.beginPath(); ctx.roundRect(-16,-10,32,20,5); ctx.fill();
                if(r.hasBushBar) { ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.strokeRect(-16,-10,32,20); }
                ctx.restore(); 
                ctx.fillStyle = "white"; ctx.font = "bold 12px Inter"; ctx.textAlign = "center"; 
                ctx.fillText(r.name.toUpperCase(), r.x, r.y-25);
            });
        }

        function updateUI() {
            const sorted = [...racers].sort((a,b) => (b.lap*10 + b.progress) - (a.lap*10 + a.progress));
            document.getElementById('leaderList').innerHTML = sorted.map((r, i) => `
                <div class="flex items-center gap-3 bg-slate-800 p-3 rounded-xl border-l-4" style="border-color: ${r.color}">
                    <span class="font-black text-slate-500">${i+1}</span>
                    <div class="flex-1 truncate font-black text-xs uppercase">${r.name}</div>
                    <div class="text-blue-400 font-black">L${r.lap}</div>
                </div>
            `).join('');
        }

        function checkWinner() {
            if(racers.every(r => r.finished) && !raceFinished) {
                raceFinished = true;
                const s = [...racers].sort((a,b) => b.progress - a.progress);
                announce("WINNER: " + s[0].name.toUpperCase());
                document.getElementById('startBtn').classList.remove('hidden');
            }
        }

        function startCountdown() {
            const div = document.getElementById('countdown'); div.classList.remove('hidden');
            let count = 3; document.getElementById('startBtn').classList.add('hidden');
            const timer = setInterval(() => {
                if(count > 0) { div.innerText = count--; } 
                else { div.innerText = "GO!"; clearInterval(timer); setTimeout(() => div.classList.add('hidden'), 1000); raceActive = true; gameLoop(); }
            }, 1000);
        }
        window.onload = () => { initRaceData(); loadStudentList(); };
    </script>
</body>
</html>
