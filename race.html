<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE GRAND PRIX - RACE CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #064e3b; margin: 0; overflow-x: hidden; overflow-y: auto; font-family: 'Inter', sans-serif; color: white; }
        canvas { display: block; background: #064e3b; }
        .admin-panel { background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid #3b82f6; backdrop-filter: blur(10px); }
        .leaderboard { background: rgba(15, 23, 42, 0.85); border-left: 2px solid #3b82f6; backdrop-filter: blur(5px); }
        .announcer-panel { background: rgba(0, 0, 0, 0.85); border-top: 4px solid #facc15; }
        .management-section { background: #0f172a; padding: 40px; border-top: 4px solid #3b82f6; min-height: 500px; }
        input, select { background: #1e293b; border: 1px solid #475569; padding: 4px 6px; border-radius: 4px; color: white; outline: none; font-size: 0.75rem; }
        #countdown { font-size: 120px; font-weight: 900; text-shadow: 0 0 30px #3b82f6; pointer-events: none; }
    </style>
</head>
<body>
    <div class="admin-panel sticky top-0 left-0 w-full z-50 p-3 flex justify-between items-center px-8 shadow-2xl">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-white">BCE <span class="text-blue-500">GP</span></h1>
            <div class="flex gap-3">
                <div class="flex flex-col">
                    <label class="text-[8px] uppercase font-bold text-slate-400">Heat / Laps</label>
                    <div class="flex gap-1">
                        <input type="number" id="heatSelect" value="1" class="w-10" onchange="initRaceData()">
                        <input type="number" id="totalLaps" value="3" class="w-10">
                    </div>
                </div>
                <div class="flex flex-col border-l border-slate-700 pl-3">
                    <label class="text-[8px] uppercase font-bold text-slate-400">Hazards (Cone / Spike / Oil)</label>
                    <div class="flex gap-1">
                        <input type="number" id="hCone" value="8" class="w-10" title="Cones" onchange="updateHazardsLive()">
                        <input type="number" id="hSpike" value="3" class="w-10" title="Spikes" onchange="updateHazardsLive()">
                        <input type="number" id="hOil" value="2" class="w-10" title="Oil Slicks" onchange="updateHazardsLive()">
                    </div>
                </div>
                <div class="flex flex-col border-l border-slate-700 pl-3">
                    <label class="text-[8px] uppercase font-bold text-slate-400">Prizes (1st / 2nd / 3rd)</label>
                    <div class="flex gap-1">
                        <input type="number" id="p1" value="100" class="w-12">
                        <input type="number" id="p2" value="50" class="w-12">
                        <input type="number" id="p3" value="25" class="w-12">
                    </div>
                </div>
            </div>
        </div>
        <button onclick="startCountdown()" id="startBtn" class="bg-blue-600 px-6 py-2 rounded font-black hover:bg-blue-500 transition-all uppercase tracking-widest text-xs active:scale-95">Start Heat</button>
    </div>

    <div class="relative">
        <div class="leaderboard absolute top-4 right-0 bottom-4 w-56 z-40 p-4 shadow-2xl rounded-l-xl">
            <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Live Standings</h2>
            <div id="leaderList" class="flex flex-col gap-2"></div>
        </div>
        <div id="countdown" class="fixed inset-0 flex items-center justify-center z-[100] hidden italic uppercase text-white"></div>
        <canvas id="raceCanvas"></canvas>
    </div>

    <div class="announcer-panel sticky bottom-0 w-full h-16 z-50 flex items-center px-10 shadow-2xl">
        <div class="bg-yellow-400 text-black px-3 py-1 font-black italic uppercase text-xs mr-4">Broadcasting</div>
        <div id="announcement" class="text-xl font-bold italic text-white tracking-wide uppercase truncate">Awaiting Race Signal...</div>
    </div>

    <div class="management-section">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-end mb-8 border-b border-slate-800 pb-6">
                <div>
                    <h2 class="text-3xl font-black italic uppercase">Race <span class="text-blue-500">Control</span></h2>
                    <p class="text-slate-400 text-sm">Assign students to heats based on Garage Sheet data.</p>
                </div>
                <div class="flex gap-3 bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Total Heats</label>
                        <input type="number" id="targetHeats" value="3" class="w-20 h-10 text-center text-lg">
                    </div>
                    <button onclick="autoAssignHeats()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded font-bold text-xs uppercase self-end h-10">Randomize All</button>
                    <button onclick="saveHeatsToSheet()" id="saveBtn" class="bg-yellow-600 hover:bg-yellow-500 px-6 py-2 rounded font-black text-xs uppercase self-end h-10">Save to Sheets</button>
                </div>
            </div>
            <table class="w-full text-left">
                <thead>
                    <tr class="text-slate-500 text-[10px] uppercase tracking-widest border-b border-slate-800">
                        <th class="pb-4">Student Name</th>
                        <th class="pb-4">Current Heat</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let allStudents = [], racers = [], hazards = [], textures = [], scenery = [], particles = [], currentLeader = null;
        let raceActive = false, raceFinished = false;
        
        const trackPath = [
            {x: 0.15, y: 0.20}, {x: 0.50, y: 0.20}, {x: 0.82, y: 0.20},
            {x: 0.85, y: 0.45}, {x: 0.65, y: 0.55}, {x: 0.45, y: 0.45},
            {x: 0.30, y: 0.65}, {x: 0.50, y: 0.82}, {x: 0.82, y: 0.82},
            {x: 0.85, y: 0.90}, {x: 0.15, y: 0.90}, {x: 0.10, y: 0.55},
            {x: 0.15, y: 0.20}
        ];

        function announce(msg) { document.getElementById('announcement').innerText = msg; }

        // Upgraded helper loops over keys cleanly to match structural data properties directly
        function parseStudent(s) {
            const keys = Object.keys(s);
            const vals = Object.values(s);
            
            // Loop keys to look for an entry matching name variants directly
            let foundName = "";
            let foundID = "";
            
            keys.forEach((k, idx) => {
                const lowKey = k.toLowerCase();
                if (lowKey.includes("name")) foundName = vals[idx];
                if (lowKey.includes("id")) foundID = vals[idx];
            });

            const id = foundID || s.studentID || s.StudentID || s.id || s.ID || vals[0] || "NoID";
            const name = foundName || s.Name || s.name || s.DisplayName || vals[1] || "Racer";
            const heat = s.Heat !== undefined ? s.Heat : (s.heat !== undefined ? s.heat : 0);
            const color = s.Colour || s.Color || s.color || "#3b82f6";
            return { id, name, heat, color, raw: s };
        }

        async function loadStudentList() {
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getStudents" }) });
                allStudents = await res.json();
                renderStudentTable();
            } catch(e) { console.error("Table Load Error", e); }
        }

        function renderStudentTable() {
            const body = document.getElementById('studentTableBody');
            body.innerHTML = allStudents.map(s => {
                const data = parseStudent(s);
                return `
                <tr>
                    <td class="py-4 font-bold text-lg">${data.name} <span class="text-[10px] text-slate-600 block">${data.id}</span></td>
                    <td class="py-4">
                        <input type="number" value="${data.heat}" 
                               class="w-20 text-center text-lg font-bold border-slate-700" 
                               onchange="updateLocalHeat('${data.id}', this.value)">
                    </td>
                </tr>`;
            }).join('');
        }

        function updateLocalHeat(id, val) {
            const student = allStudents.find(s => parseStudent(s).id == id);
            if(student) {
                const heatNum = parseInt(val) || 0;
                student.heat = heatNum;
                student.Heat = heatNum;
                if(student.studentID) student.id = student.studentID; 
            }
        }

        function autoAssignHeats() {
            const numHeats = parseInt(document.getElementById('targetHeats').value) || 1;
            const shuffled = [...allStudents].sort(() => 0.5 - Math.random());
            shuffled.forEach((s, index) => {
                const h = (index % numHeats) + 1;
                s.heat = h;
                s.Heat = h;
                const parsed = parseStudent(s);
                s.id = parsed.id;
            });
            renderStudentTable();
        }

        async function saveHeatsToSheet() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "SAVING...";
            const cleanAssignments = allStudents.map(s => {
                const parsed = parseStudent(s);
                return { id: parsed.id, heat: parsed.heat };
            });
            try {
                const response = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "updateBulkHeats", assignments: cleanAssignments }) });
                const result = await response.json();
                if(result.success) { alert("Cloud Sync Complete!"); initRaceData(); } 
                else { alert("Error saving: " + (result.message || "Unknown error")); }
            } catch(e) { console.error(e); alert("Network error syncing to Sheets."); } 
            finally { btn.innerText = "SAVE TO SHEETS"; }
        }

        // --- SMOKE ENGINE ---
        function createSmoke(x, y) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                alpha: 0.5,
                size: 3 + Math.random() * 5
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.alpha -= 0.02; p.size += 0.12;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // --- ENVIRONMENT LOGIC ---
        function createEnvironment() {
            if (textures.length === 0) {
                const colors = ["#14532d", "#064e3b", "#3f6212", "#78350f"];
                for(let i=0; i<45; i++) {
                    textures.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, w: 150+Math.random()*300, h: 100+Math.random()*200, c: colors[Math.floor(Math.random()*colors.length)] + "55" });
                }
                for(let i=0; i<30; i++) { scenery.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: 8+Math.random()*15 }); }
            }
            hazards = [];
            const counts = { cones: parseInt(document.getElementById('hCone').value) || 0, spikes: parseInt(document.getElementById('hSpike').value) || 0, oil: parseInt(document.getElementById('hOil').value) || 0 };
            Object.entries(counts).forEach(([type, count]) => {
                for(let i=0; i<count; i++) { hazards.push({ progress: 0.15 + Math.random()*0.80, lane: Math.floor(Math.random()*4), type: type, active: true }); }
            });
        }

        function updateHazardsLive() { createEnvironment(); draw(); }
        function hasUpgrade(r, keyword) { return Object.values(r).some(val => val && String(val).toLowerCase().includes(keyword.toLowerCase())); }

        async function initRaceData() {
            canvas.width = window.innerWidth; canvas.height = 600;
            textures = []; scenery = []; particles = [];
            createEnvironment();
            try {
                const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "getHeat", heat: document.getElementById('heatSelect').value }) });
                const data = await res.json();
                
                racers = (data.racers || []).map((r, i) => {
                    const p = parseStudent(r);
                    let base = 0.0011;
                    if (hasUpgrade(r, "Electric")) base += 0.00015;
                    if (hasUpgrade(r, "V8")) base += 0.0003;
                    if (hasUpgrade(r, "V12")) base += 0.0008;
                    if (hasUpgrade(r, "Hard Tire")) base += 0.0003;
                    if (hasUpgrade(r, "Soft Tire")) base -= 0.0001; 
                    if (hasUpgrade(r, "Nitro")) base += 0.0004;

                    let rowIndex = Math.floor(i / 4);  
                    let colIndex = i % 4;              
                    
                    let gridStartProgress = 0 - (rowIndex * 0.022);
                    let exactLaneOffset = (colIndex - 1.5) * 16; 

                    return {
                        ...r, id: p.id, name: p.name, color: p.color,
                        progress: gridStartProgress, lap: 1, speedBase: base, currentSpeed: 0, 
                        penalty: 0, spinFrames: 0, flats: 0, collisionCooldown: 0,
                        x: 0, y: 0, angle: 0, lane: colIndex, laneOffset: exactLaneOffset, finished: false,
                        hasBushBar: hasUpgrade(r, "Bush"),
                        hasSpikeShield: hasUpgrade(r, "Inflate") || hasUpgrade(r, "Self") || hasUpgrade(r, "Spare"),
                        hasGrip: hasUpgrade(r, "Grip"),
                        hasSoftTires: hasUpgrade(r, "Soft Tire")
                    }
                });
                announce("Heat " + document.getElementById('heatSelect').value + " Grid Locked.");
                draw();
            } catch(e) { console.error(e); }
        }

        function gameLoop() {
            if(!raceActive) return;
            
            updateParticles();

            for (let i = 0; i < racers.length; i++) {
                for (let j = i + 1; j < racers.length; j++) {
                    let r1 = racers[i]; let r2 = racers[j];
                    if (r1.finished || r2.finished || r1.progress < 0 || r2.progress < 0) continue;

                    let dx = r1.x - r2.x; let dy = r1.y - r2.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < 16) { 
                        if (r1.collisionCooldown === 0 && r2.collisionCooldown === 0) {
                            r1.collisionCooldown = 60; r2.collisionCooldown = 60;
                            announce(`💥 CONTACT: ${r1.name.toUpperCase()} & ${r2.name.toUpperCase()} BUMPED!`);
                        }
                    }
                }
            }

            racers.forEach(r => {
                if(r.finished) return;
                
                let speedMod = Math.max(0.15, Math.pow(0.75, r.flats));
                if (r.collisionCooldown > 0) { speedMod *= 0.5; r.collisionCooldown--; }

                hazards.forEach(h => {
                    if(h.active && h.lane === r.lane && Math.abs(r.progress - h.progress) < 0.007) {
                        if(h.type === 'cones') { 
                            if (r.hasBushBar) { announce(`🛡️ ${r.name.toUpperCase()} SMASHED CONE!`); h.active = false; }
                            else { r.penalty = 120; h.active = false; announce(`⚠️ ${r.name.toUpperCase()} HIT CONE!`); }
                        }
                        else if(h.type === 'spikes') { 
                            if (r.hasSpikeShield) { announce(`🛡️ ${r.name.toUpperCase()} TIRE PROTECTED!`); h.active = false; }
                            else { r.flats++; h.active = false; announce(`💥 ${r.name.toUpperCase()} POPPED TIRE!`); }
                        }
                        else if(h.type === 'oil') { 
                            if (r.hasGrip) { announce(`🛡️ ${r.name.toUpperCase()} GRIPPED OIL!`); h.active = false; }
                            else { r.spinFrames = 120; h.active = false; announce(`🌀 ${r.name.toUpperCase()} SPINNING!`); }
                        }
                    }
                });

                if(r.spinFrames > 0) { r.currentSpeed = 0; r.angle += 0.4; r.spinFrames--; } 
                else {
                    r.currentSpeed = (r.penalty > 0) ? r.speedBase * 0.3 * speedMod : r.speedBase * speedMod;
                    if(r.penalty > 0) r.penalty--;
                    
                    let randomJitter = 0.96 + Math.random() * 0.08;
                    r.progress += r.currentSpeed * randomJitter;

                    const pos = getPointOnPath(Math.max(0, Math.min(0.999, r.progress)));
                    
                    r.angle = pos.a; 
                    r.x = pos.x + Math.cos(pos.a + Math.PI/2)*r.laneOffset;
                    r.y = pos.y + Math.sin(pos.a + Math.PI/2)*r.laneOffset;

                    if(r.progress > 0 && Math.random() > 0.4) {
                        let backX = r.x - Math.cos(r.angle) * 10;
                        let backY = r.y - Math.sin(r.angle) * 10;
                        createSmoke(backX, backY);
                    }
                }

                if(r.progress >= 0.999) {
                    if(r.lap < parseInt(document.getElementById('totalLaps').value)) { r.lap++; r.progress = 0; }
                    else { r.finished = true; checkWinner(); }
                }
            });

            const leader = [...racers].sort((a,b) => (b.lap*10 + b.progress) - (a.lap*10 + a.progress))[0];
            if(leader && leader.name !== currentLeader && leader.progress > 0) {
                currentLeader = leader.name;
                announce(`${currentLeader.toUpperCase()} TAKES THE LEAD!`);
            }
            updateUI(); draw();
            if(racers.some(r => !r.finished)) requestAnimationFrame(gameLoop);
        }

        function getPointOnPath(t) {
            const sections = trackPath.length - 1;
            const p = Math.max(0, Math.min(0.999, t));
            const sec = Math.floor(p * sections);
            const secT = (p * sections) - sec;
            const p1 = trackPath[sec], p2 = trackPath[sec+1] || trackPath[0];
            const tw = canvas.width - 224;
            return { x: (p1.x + (p2.x - p1.x)*secT)*tw, y: (p1.y + (p2.y - p1.y)*secT)*canvas.height, a: Math.atan2(p2.y-p1.y, p2.x-p1.x) };
        }

        function draw() {
            ctx.fillStyle = "#166534"; ctx.fillRect(0,0,canvas.width,canvas.height);
            textures.forEach(t => { ctx.fillStyle = t.c; ctx.beginPath(); ctx.ellipse(t.x,t.y,t.w,t.h,0,0,Math.PI*2); ctx.fill(); });
            scenery.forEach(s => { ctx.fillStyle = "#022c2288"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); });
            
            const tw = canvas.width - 224;
            
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 110; ctx.lineJoin = "round"; ctx.lineCap = "round";
            ctx.beginPath(); trackPath.forEach((p,i) => i===0 ? ctx.moveTo(p.x*tw, p.y*canvas.height) : ctx.lineTo(p.x*tw, p.y*canvas.height)); ctx.stroke();
            
            ctx.strokeStyle = "white"; ctx.lineWidth = 100; ctx.stroke();
            
            ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 94; ctx.stroke();

            ctx.strokeStyle = "#475569"; ctx.lineWidth = 2; ctx.setLineDash([10,15]); ctx.stroke();
            ctx.setLineDash([]); 

            const finishPos = getPointOnPath(0.0);
            ctx.save();
            ctx.translate(finishPos.x, finishPos.y);
            ctx.rotate(finishPos.a + Math.PI/2);
            let boxSize = 9;
            for(let row=0; row<2; row++) {
                for(let col=-5; col<5; col++) {
                    ctx.fillStyle = (row + col) % 2 === 0 ? "white" : "black";
                    ctx.fillRect(col * boxSize, (row - 1) * boxSize, boxSize, boxSize);
                }
            }
            ctx.restore();

            particles.forEach(p => {
                ctx.fillStyle = `rgba(226, 232, 240, ${p.alpha})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });

            hazards.forEach(h => {
                if(!h.active && h.type !== 'oil') return;
                const pos = getPointOnPath(h.progress);
                const lo = (h.lane - 1.5) * 16;
                const px = pos.x + Math.cos(pos.a+Math.PI/2)*lo, py = pos.y + Math.sin(pos.a+Math.PI/2)*lo;
                if(h.type === 'cones') { ctx.fillStyle = "#f97316"; ctx.beginPath(); ctx.moveTo(px,py-6); ctx.lineTo(px+5,py+6); ctx.lineTo(px-5,py+6); ctx.fill(); }
                else if(h.type === 'spikes') { ctx.fillStyle = "#94a3b8"; ctx.fillRect(px-8, py+1, 16, 2); for(let i=0; i<3; i++) { ctx.beginPath(); ctx.moveTo(px-6+(i*6), py+1); ctx.lineTo(px-3+(i*6), py-5); ctx.lineTo(px+(i*6), py+1); ctx.fill(); } }
                else if(h.type === 'oil') { ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI*2); ctx.fill(); }
            });

            racers.forEach(r => {
                if (!raceActive && r.x === 0) {
                    const pos = getPointOnPath(Math.max(0, r.progress));
                    r.x = pos.x + Math.cos(pos.a + Math.PI/2)*r.laneOffset;
                    r.y = pos.y + Math.sin(pos.a + Math.PI/2)*r.laneOffset;
                    r.angle = pos.a;
                }
                ctx.save(); 
                ctx.translate(r.x, r.y); 
                ctx.rotate(r.angle); 
                
                ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(-10, -5, 22, 11);
                
                ctx.fillStyle = r.color; 
                ctx.beginPath(); ctx.roundRect(-12,-6,24,12,3.5); ctx.fill();
                
                ctx.fillStyle = "#94a3b8"; ctx.fillRect(2, -4, 4, 8);
                ctx.fillStyle = "#1e293b"; ctx.fillRect(-4, -4, 5, 8);

                if(r.hasBushBar) { ctx.strokeStyle = "#64748b"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(12, -8); ctx.lineTo(15, -8); ctx.lineTo(15, 8); ctx.lineTo(12, 8); ctx.stroke(); }
                if(r.collisionCooldown > 0) { ctx.fillStyle = "rgba(239, 68, 68, 0.45)"; ctx.roundRect(-12,-6,24,12,3.5); ctx.fill(); }
                
                ctx.restore(); 
                
                ctx.fillStyle = "white"; ctx.font = "bold 11px Inter"; ctx.textAlign = "center"; 
                ctx.fillText(r.name, r.x, r.y-16);
            });
        }

        function updateUI() {
            const sorted = [...racers].sort((a,b) => (b.lap*10 + b.progress) - (a.lap*10 + a.progress));
            document.getElementById('leaderList').innerHTML = sorted.slice(0, 8).map((r, i) => `
                <div class="flex items-center gap-2 bg-slate-800/90 p-2 rounded text-[11px] border-l-4" style="border-color: ${r.color}">
                    <span class="font-black text-slate-500">${i+1}</span>
                    <div class="flex-1 truncate font-bold text-white uppercase italic">${r.name}</div>
                    <div class="text-blue-400 font-black">L${r.lap}</div>
                </div>`).join('');
        }

        async function checkWinner() {
            if(racers.every(r => r.finished) && !raceFinished) {
                raceFinished = true;
                const s = [...racers].sort((a,b) => b.progress - a.progress);
                const p = [document.getElementById('p1').value, document.getElementById('p2').value, document.getElementById('p3').value];
                announce(`🏁 RACE OVER: ${s[0].name.toUpperCase()} WINS!`);
                for(let i=0; i<3; i++) { 
                    if(s[i] && s[i].id) {
                        try { await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "payoutRace", winnerID: s[i].id, amount: parseInt(p[i]) }) }); } 
                        catch(e) { console.error("Payout failed"); }
                    } 
                }
                alert(`PODIUM:\n1st: ${s[0].name}\n2nd: ${s[1].name}\n3rd: ${s[2].name}`);
                document.getElementById('startBtn').classList.remove('hidden');
            }
        }

        function startCountdown() {
            const div = document.getElementById('countdown'); div.classList.remove('hidden');
            let count = 3; document.getElementById('startBtn').classList.add('hidden');
            const timer = setInterval(() => {
                if(count > 0) { div.innerText = count--; } 
                else { 
                    div.innerText = "GO!"; clearInterval(timer); 
                    setTimeout(() => div.classList.add('hidden'), 1000); 
                    raceActive = true; raceFinished = false; gameLoop(); 
                }
            }, 1000);
        }
        
        window.onload = () => { initRaceData(); loadStudentList(); };
        window.onresize = () => { canvas.width = window.innerWidth; draw(); };
    </script>
</body>
</html>
