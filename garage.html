<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE | The Garage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .racing-font { font-family: 'Orbitron', sans-serif; }
        
        .garage-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #carCanvas {
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4));
        }

        .part-btn {
            background: rgba(15, 23, 42, 0.6);
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .part-btn:hover:not(:disabled) {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .owned {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.1) !important;
            color: #10b981;
            cursor: default;
        }

        .stat-bar-container {
            width: 100%;
            background-color: #020617;
            height: 8px;
            border-radius: 9999px;
            border: 1px solid #334155;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div id="garageUI" class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <a href="student.html" class="text-blue-400 hover:text-blue-300 text-xs font-bold uppercase tracking-widest transition flex items-center gap-2 mb-2">
                    ← Return to Bank Portal
                </a>
                <h1 class="racing-font text-3xl italic text-white uppercase tracking-tighter">
                    BCE Grand Prix <span class="text-blue-500">Garage</span>
                </h1>
                <p id="driverName" class="text-slate-400 font-bold uppercase text-xs tracking-widest mt-1">Authenticating Driver...</p>
            </div>
            <div class="garage-card px-6 py-3 rounded-2xl border-l-4 border-emerald-500">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Available Credits</p>
                <p id="balanceDisplay" class="text-2xl font-bold text-emerald-400 font-mono tracking-tighter">$0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="garage-card rounded-3xl p-8 flex flex-col items-center justify-center relative min-h-[500px] overflow-hidden">
                <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');"></div>
                <canvas id="carCanvas" width="300" height="380" class="relative z-10 mb-6"></canvas>
                
                <div class="w-full space-y-4 relative z-10 px-4">
                    <div>
                        <div class="flex justify-between text-[10px] racing-font mb-1 text-slate-400">
                            <span>TOP SPEED</span>
                            <span id="val-speed">20/100</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="bar-speed" class="h-full bg-blue-500 shadow-[0_0_10px_#3b82f6] transition-all duration-1000" style="width: 20%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] racing-font mb-1 text-slate-400">
                            <span>HANDLING</span>
                            <span id="val-handling">20/100</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="bar-handling" class="h-full bg-purple-500 shadow-[0_0_10px_#a855f7] transition-all duration-1000" style="width: 20%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] racing-font mb-1 text-slate-400">
                            <span>ACCELERATION</span>
                            <span id="val-control">20/100</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="bar-control" class="h-full bg-emerald-500 shadow-[0_0_10px_#10b981] transition-all duration-1000" style="width: 20%"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 grid grid-cols-3 gap-2 w-full relative z-10">
                    <div class="p-2 bg-slate-900/80 rounded-xl border border-slate-700 text-center">
                        <span class="text-[9px] text-slate-500 uppercase block font-black">Engine</span>
                        <span id="stat-motor" class="font-bold text-blue-400 text-xs">Standard</span>
                    </div>
                    <div class="p-2 bg-slate-900/80 rounded-xl border border-slate-700 text-center">
                        <span class="text-[9px] text-slate-500 uppercase block font-black">Tires</span>
                        <span id="stat-tires" class="font-bold text-purple-400 text-xs">Standard</span>
                    </div>
                    <div class="p-2 bg-slate-900/80 rounded-xl border border-slate-700 text-center">
                        <span class="text-[9px] text-slate-500 uppercase block font-black">Addon</span>
                        <span id="stat-addon" class="font-bold text-yellow-400 text-xs">None</span>
                    </div>
                </div>
            </div>

            <div class="space-y-6 max-h-[700px] overflow-y-auto pr-2">
                <div class="garage-card rounded-2xl p-6">
                    <h2 class="racing-font text-sm mb-4 text-slate-400 flex items-center gap-2">
                        <span class="w-2 h-4 bg-blue-500 block"></span> ENGINES
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="buy('Motor', 'Electric Motor', 250)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold">Electric Motor</span>
                            <span class="text-xs text-slate-400">+10 Accel | +3 Speed • $250</span>
                        </button>
                        <button onclick="buy('Motor', 'V8 Motor', 1200)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold text-orange-400">V8 Motor</span>
                            <span class="text-xs text-slate-400">+5 Accel | +5 Speed • $1200</span>
                        </button>
                        <button onclick="buy('Motor', 'V12 Performance', 2500)" class="part-btn p-4 rounded-xl text-left col-span-1 sm:col-span-2">
                            <span class="block font-bold text-red-500">V12 Performance</span>
                            <span class="text-xs text-slate-400">+20 Speed | +10 Accel | -10 Handling • $2500</span>
                        </button>
                    </div>
                </div>

                <div class="garage-card rounded-2xl p-6">
                    <h2 class="racing-font text-sm mb-4 text-slate-400 flex items-center gap-2">
                        <span class="w-2 h-4 bg-purple-500 block"></span> TIRES
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="buy('Tires', 'Soft Tire', 400)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold">Soft Tire</span>
                            <span class="text-xs text-slate-400">+10 Handling | -3 Speed • $400</span>
                        </button>
                        <button onclick="buy('Tires', 'Hard Tire', 400)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold">Hard Tire</span>
                            <span class="text-xs text-slate-400">+10 Speed | -4 Handling • $400</span>
                        </button>
                        <button onclick="buy('Tires', 'Self-Inflated', 600)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold text-cyan-400">Self-Inflated</span>
                            <span class="text-xs text-slate-400">Spike Resistance • $600</span>
                        </button>
                        <button onclick="buy('Tires', 'Grip Tires', 600)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold text-emerald-400">Grip Tires</span>
                            <span class="text-xs text-slate-400">Oil Resistance • $600</span>
                        </button>
                    </div>
                </div>

                <div class="garage-card rounded-2xl p-6">
                    <h2 class="racing-font text-sm mb-4 text-slate-400 flex items-center gap-2">
                        <span class="w-2 h-4 bg-yellow-500 block"></span> ADDONS
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="buy('Addon', 'Bush Bar', 500)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold">Bush Bar</span>
                            <span class="text-xs text-slate-400">Cone Resistance • $500</span>
                        </button>
                        <button onclick="buy('Addon', 'Nitro', 1000)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold text-blue-400">Nitro</span>
                            <span class="text-xs text-slate-400">+10 Speed • $1000</span>
                        </button>
                        <button onclick="buy('Addon', 'Suspension', 500)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold">Suspension</span>
                            <span class="text-xs text-slate-400">+10 Handling • $500</span>
                        </button>
                        <button onclick="buy('Addon', 'Spare Tire', 300)" class="part-btn p-4 rounded-xl text-left">
                            <span class="block font-bold">Spare Tire</span>
                            <span class="text-xs text-slate-400">Spike Shield • $300</span>
                        </button>
                    </div>
                </div>

                <div class="garage-card rounded-2xl p-6">
                    <h2 class="racing-font text-sm mb-4 text-slate-400 flex items-center gap-2">
                        <span class="w-2 h-4 bg-emerald-500 block"></span> PAINT SHOP
                    </h2>
                    <div class="flex gap-4 items-center">
                        <input type="color" id="colorPicker" value="#3b82f6" oninput="drawCar(this.value)" class="h-14 w-20 bg-slate-800 border-none rounded-xl cursor-pointer">
                        <div class="flex-grow">
                            <button onclick="saveColor()" class="w-full bg-slate-700 hover:bg-blue-600 text-white py-3 rounded-lg font-bold text-sm transition">Update Paint (Free)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;
        let studentID = localStorage.getItem('studentID') ? localStorage.getItem('studentID').trim() : null;
        let currentCar = {};

        async function initGarage() {
            if (!studentID) {
                alert("Please log in via the Student Portal first.");
                window.location.href = "index.html";
                return;
            }
            
            const displayName = localStorage.getItem('studentName') || "Unknown";
            document.getElementById('driverName').innerText = "Driver: " + displayName;
            
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getGarage", studentID: studentID })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentCar = data;
                    const bal = parseFloat(data.balance) || 0;
                    document.getElementById('balanceDisplay').innerText = "$" + bal.toFixed(2);
                    
                    updateUI();
                    drawCar(currentCar.color || "#3b82f6");
                    document.getElementById('colorPicker').value = currentCar.color || "#3b82f6";
                }
            } catch (e) {
                console.error("Garage Load Error:", e);
            }
        }

        function updateUI() {
            document.getElementById('stat-motor').innerText = currentCar.motor || "Standard";
            document.getElementById('stat-tires').innerText = currentCar.tires || "Standard";
            document.getElementById('stat-addon').innerText = currentCar.addon || "None";
            
            const clean = (str) => str ? str.toString().replace(/[\s-]/g, '').toLowerCase() : "";

            const equippedParts = [
                clean(currentCar.motor), 
                clean(currentCar.tires), 
                clean(currentCar.addon)
            ];

            const ownedParts = currentCar.owned ? currentCar.owned.map(p => clean(p)) : [];

            const allBtns = document.querySelectorAll('.part-btn');

            allBtns.forEach(btn => {
                const partNameLabel = btn.querySelector('span').innerText;
                const partClean = clean(partNameLabel);
                const statusLabel = btn.querySelector('span:last-child');
                
                btn.classList.remove('owned');
                btn.disabled = false;

                if (equippedParts.includes(partClean)) {
                    btn.classList.add('owned');
                    btn.disabled = true;
                    statusLabel.innerText = "Installed";
                    statusLabel.className = "text-[10px] uppercase font-black opacity-80";
                } 
                else if (ownedParts.includes(partClean)) {
                    btn.disabled = false;
                    statusLabel.innerText = "Purchased (Switch)";
                    statusLabel.className = "text-[10px] uppercase font-black text-blue-400";
                }
            });

            calculateStats();
        }

        function calculateStats() {
            let stats = { speed: 20, handling: 20, control: 20 };
            
            // Motors
            if (currentCar.motor === "Electric Motor") { stats.control += 10; stats.speed += 3; }
            if (currentCar.motor === "V8 Motor") { stats.control += 5; stats.speed += 5; }
            if (currentCar.motor === "V12 Performance") { stats.speed += 20; stats.control += 10; stats.handling -= 10; }
            
            // Tires
            if (currentCar.tires === "Soft Tire") { stats.handling += 10; stats.speed -= 3; }
            if (currentCar.tires === "Hard Tire") { stats.speed += 10; stats.handling -= 4; }
            if (currentCar.tires === "Grip Tires") { stats.handling += 5; }
            if (currentCar.tires === "Self-Inflated") { stats.handling += 2; }
            
            // Addons
            if (currentCar.addon === "Nitro") { stats.speed += 10; }
            if (currentCar.addon === "Suspension") { stats.handling += 10; }
            if (currentCar.addon === "Bush Bar") { stats.handling += 5; }
            if (currentCar.addon === "Spare Tire") { stats.handling += 5; stats.speed -= 2; }

            Object.keys(stats).forEach(key => {
                let val = Math.max(0, Math.min(stats[key], 100));
                const bar = document.getElementById(`bar-${key}`);
                const valText = document.getElementById(`val-${key}`);
                if(bar) bar.style.width = val + "%";
                if(valText) valText.innerText = val + "/100";
            });
        }

        async function buy(type, name, cost) {
            const clean = (str) => str ? str.toString().replace(/[\s-]/g, '').toLowerCase() : "";
            const isOwned = currentCar.owned && currentCar.owned.some(p => clean(p) === clean(name));
            
            const msg = isOwned ? `Switch to ${name}? (No charge)` : `Install ${name} for $${cost}?`;
            
            if(!confirm(msg)) return;
            
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "buyPart",
                        studentID: studentID,
                        partType: type,
                        partName: name,
                        cost: isOwned ? 0 : cost
                    })
                });
                const result = await res.json();
                if(result.success) {
                    alert(result.message || "Garage Updated!");
                    initGarage(); 
                } else {
                    alert("Error: " + result.message);
                }
            } catch (e) {
                alert("Transaction failed. Check connection.");
            }
        }

        async function saveColor() {
            const color = document.getElementById('colorPicker').value;
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "buyPart",
                        studentID: studentID,
                        partType: "Color",
                        partName: color,
                        cost: 0
                    })
                });
                const result = await res.json();
                if(result.success) {
                    alert("Paint Job Updated!");
                    initGarage();
                } else {
                    alert("Error saving color.");
                }
            } catch (e) { console.log(e); }
        }

        function drawCar(color) {
            const canvas = document.getElementById('carCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 300, 400);
            
            ctx.fillStyle = "#020617";
            ctx.roundRect(45, 60, 45, 80, 10); ctx.fill(); 
            ctx.roundRect(210, 60, 45, 80, 10); ctx.fill();
            ctx.roundRect(45, 300, 50, 90, 10); ctx.fill();
            ctx.roundRect(205, 300, 50, 90, 10); ctx.fill();
            
            ctx.fillStyle = color;
            ctx.shadowBlur = 15; ctx.shadowColor = color;
            ctx.beginPath();
            ctx.moveTo(150, 30);
            ctx.bezierCurveTo(240, 40, 240, 380, 220, 390);
            ctx.lineTo(80, 390);
            ctx.bezierCurveTo(60, 380, 60, 40, 150, 30);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
            ctx.roundRect(100, 160, 100, 120, [40, 40, 10, 10]); ctx.fill();
            
            ctx.fillStyle = "#020617";
            ctx.fillRect(60, 370, 180, 20);
        }

        window.onload = initGarage;
    </script>
</body>
</html>
