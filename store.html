<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .glass-card { background: #161d2f; border: 1px solid #2d3748; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">The Shop</h1>
                <p class="text-slate-400">Your One Stop Shop</p>
            </div>
            <button onclick="location.href='student.html'" class="text-blue-400 hover:text-white font-bold transition flex items-center gap-2">
                ← Back to Bank
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4" id="partGrid">
                <div class="p-10 text-center text-slate-500 animate-pulse">Loading parts catalog...</div>
            </div>

            <div class="glass-card p-6 rounded-3xl h-fit sticky top-8 shadow-2xl">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2">🛒 Your Cart</h2>
                
                <div id="cartItems" class="space-y-4 mb-6 border-b border-slate-800 pb-6 max-h-[400px] overflow-y-auto">
                    <p class="text-slate-500 text-sm italic text-center">No parts selected</p>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400 uppercase tracking-wider text-xs">Subtotal</span>
                        <span id="subtotal" class="font-mono text-slate-200">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-slate-400 uppercase tracking-wider text-xs">HST (13%)</span>
                        <span id="taxAmount" class="font-mono text-slate-200">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                        <span class="text-white font-bold uppercase text-xs">Total Cost</span>
                        <span id="cartTotal" class="text-2xl font-bold text-emerald-400 font-mono">$0.00</span>
                    </div>
                    
                    <button onclick="checkout()" id="checkoutBtn" disabled class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 text-white font-bold py-4 rounded-2xl transition transform active:scale-95 mt-4">
                        Confirm Purchase
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update this URL to your latest deployment whenever you change Code.gs
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwXOQNaGHeR-O1o9p-Yt9qoTpYDYcUYky2OmdvrWrti3-UvI9RWw0znyTWeHMsKEhgx/exec"; 
        const TAX_RATE = 0.13;
        let cart = [];

        async function loadParts() {
            try {
                const response = await fetch(WEB_APP_URL + "?action=getStoreItems");
                const parts = await response.json();
                const grid = document.getElementById('partGrid');
                grid.innerHTML = '';

                parts.forEach((part, idx) => {
                    grid.innerHTML += `
                        <div class="glass-card p-6 rounded-2xl flex justify-between items-center gap-4 hover:border-slate-500 transition-colors">
                            <div>
                                <h3 class="text-xl font-bold text-white">${part[0]}</h3>
                                <p class="text-slate-400 text-sm">${part[2] || 'Standard Part'}</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="text-lg font-mono font-bold text-blue-400">$${parseFloat(part[1]).toFixed(2)}</span>
                                <input type="number" id="qty-${idx}" value="1" min="1" class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center font-bold text-white">
                                <button onclick="addToCart('${part[0]}', ${part[1]}, 'qty-${idx}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold transition">Add</button>
                            </div>
                        </div>`;
                });
            } catch (e) { console.error("Inventory error:", e); }
        }

        function addToCart(name, price, qtyId) {
            const qty = parseInt(document.getElementById(qtyId).value);
            const existing = cart.find(i => i.name === name);
            if (existing) { existing.qty += qty; } else { cart.push({ name, price, qty }); }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const subtotalEl = document.getElementById('subtotal');
            const taxEl = document.getElementById('taxAmount');
            const totalEl = document.getElementById('cartTotal');
            
            container.innerHTML = '';
            let subtotal = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm italic text-center">No parts selected</p>';
            } else {
                cart.forEach((item) => {
                    subtotal += item.price * item.qty;
                    container.innerHTML += `
                        <div class="flex justify-between text-sm items-center bg-slate-900/30 p-2 rounded-lg">
                            <span class="text-slate-200"><span class="text-blue-400 font-bold">${item.qty}x</span> ${item.name}</span>
                            <span class="font-mono">$${(item.price * item.qty).toFixed(2)}</span>
                        </div>`;
                });
            }

            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;

            subtotalEl.innerText = `$${subtotal.toFixed(2)}`;
            taxEl.innerText = `$${tax.toFixed(2)}`;
            totalEl.innerText = `$${total.toFixed(2)}`;
            
            document.getElementById('checkoutBtn').disabled = cart.length === 0;
        }

        async function checkout() {
            const studentID = localStorage.getItem('studentID');
            const studentName = localStorage.getItem('studentName');
            const finalTotal = parseFloat(document.getElementById('cartTotal').innerText.replace('$', ''));

            if (!studentID) return alert("Error: No student session found. Please log in again.");
            if (!confirm(`Confirm purchase for $${finalTotal.toFixed(2)} (including 13% HST)?`)) return;
            
            const btn = document.getElementById('checkoutBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "purchaseItems",
                        studentID: studentID,
                        studentName: studentName,
                        cart: cart,
                        total: finalTotal
                    })
                });

                const data = await res.json();
                if (data.success) {
                    alert("Purchase complete! Order sent to teacher for fulfillment.");
                    cart = []; 
                    renderCart();
                    window.location.href = 'student.html'; // Redirect to student dashboard
                } else { 
                    alert("Transaction failed: " + data.message); 
                    btn.innerText = "Confirm Purchase"; 
                    btn.disabled = false; 
                }
            } catch (e) {
                alert("Network error. Please try again.");
                btn.innerText = "Confirm Purchase";
                btn.disabled = false;
            }
        }

        loadParts();
    </script>
</body>
</html>
