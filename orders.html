<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Fulfillment | STEM Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .glass-card { background: #161d2f; border: 1px solid #2d3748; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold">📦 Pending Orders</h1>
                <p class="text-slate-400">Items waiting to be packaged and delivered</p>
            </div>
            <button onclick="location.href='admin.html'" class="text-slate-400 hover:text-white">← Back</button>
        </header>

        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <table class="w-full text-left">
                <thead class="bg-slate-900/50 text-slate-500 text-xs uppercase tracking-widest">
                    <tr>
                        <th class="p-5">Time</th>
                        <th class="p-5">Student</th>
                        <th class="p-5">Items</th>
                        <th class="p-5">Total</th>
                    </tr>
                </thead>
                <tbody id="orderList" class="divide-y divide-slate-800">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "YOUR_DEPLOYED_URL_HERE";

        async function loadOrders() {
            const res = await fetch(WEB_APP_URL + "?action=getOrders");
            const orders = await res.json();
            const list = document.getElementById('orderList');
            list.innerHTML = orders.reverse().map(o => `
                <tr class="hover:bg-slate-800/30">
                    <td class="p-5 text-xs text-slate-500 font-mono">${new Date(o[0]).toLocaleTimeString()}</td>
                    <td class="p-5 font-bold text-white">${o[1]}</td>
                    <td class="p-5 text-sm text-slate-300">${o[2]}</td>
                    <td class="p-5 font-mono text-emerald-400 font-bold">$${parseFloat(o[3]).toFixed(2)}</td>
                </tr>
            `).join('');
        }
        loadOrders();
        setInterval(loadOrders, 30000); // Auto-refresh every 30 seconds
    </script>
</body>
</html>
