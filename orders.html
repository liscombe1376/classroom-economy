<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Fulfillment | STEM Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .glass-card { background: #161d2f; border: 1px solid #2d3748; }
        
        /* Loading Spinner Animation */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">📦 STEM Store Orders</h1>
                <p class="text-slate-400 mt-1">Live fulfillment queue for The Shop</p>
            </div>
            <div class="flex items-center gap-4">
                <div id="statusIndicator" class="hidden flex items-center gap-2 text-xs font-bold text-blue-400 uppercase tracking-widest">
                    <div class="spinner"></div> Updating
                </div>
                <button onclick="location.href='admin.html'" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 rounded-xl text-sm font-semibold transition border border-slate-700">
                    ← Back to Admin
                </button>
            </div>
        </header>

        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <table class="w-full text-left">
                <thead class="bg-slate-900/50 text-slate-500 text-xs uppercase tracking-widest border-b border-slate-800">
                    <tr>
                        <th class="p-5">Time</th>
                        <th class="p-5">Student</th>
                        <th class="p-5">Items Purchased</th>
                        <th class="p-5">Total Charge</th>
                        <th class="p-5">Status</th>
                        <th class="p-5 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="orderList" class="divide-y divide-slate-800 text-sm">
                    <tr>
                        <td colspan="6" class="p-20 text-center text-slate-500">
                            <div class="flex flex-col items-center gap-3">
                                <div class="spinner mx-auto"></div>
                                Connecting to ClassBank...
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = GLOBAL_CONFIG.WEB_APP_URL;

        async function loadOrders() {
            const statusIndicator = document.getElementById('statusIndicator');
            statusIndicator.classList.remove('hidden');

            try {
                // Fetch with action and a timestamp to force fresh data
                const res = await fetch(`${WEB_APP_URL}?action=getOrders&t=${Date.now()}`);
                const rawOrders = await res.json();
                const list = document.getElementById('orderList');
                
                if (!rawOrders || rawOrders.length === 0) {
                    list.innerHTML = `<tr><td colspan="6" class="p-20 text-center text-slate-500 font-medium italic">No orders found in the sheet database.</td></tr>`;
                    return;
                }

                // Map entries along with their exact physical row number from the spreadsheet
                // Row 1 is headers, so index 0 is Row 2, index 1 is Row 3, etc.
                const mappedOrders = rawOrders.map((o, idx) => ({
                    rowData: o,
                    sheetRowNum: idx + 2 
                }));

                // Filter out header rows if they get fetched by mistake
                const cleanOrders = mappedOrders.filter(item => item.rowData[0] !== "Timestamp" && item.rowData[0] !== "");
                
                // Show newest orders at the top
                cleanOrders.reverse();

                list.innerHTML = cleanOrders.map(item => {
                    const o = item.rowData;
                    const rowNumber = item.sheetRowNum; // This is the tracking row id

                    const timestamp = o[0];
                    const studentName = o[1];
                    const itemSummary = o[2];
                    const totalCost = parseFloat(o[3] || 0).toFixed(2);
                    const status = o[4] ? o[4].toString().trim() : 'Pending';

                    const isPending = status.toLowerCase() === 'pending';
                    const badgeColor = isPending 
                        ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' 
                        : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

                    // Human-readable local time formatting
                    let formattedTime = "---";
                    if(timestamp) {
                        try { formattedTime = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); } catch(e){}
                    }

                    return `
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="p-5 text-xs text-slate-500 font-mono">${formattedTime}</td>
                            <td class="p-5 font-bold text-white capitalize">${studentName}</td>
                            <td class="p-5 text-slate-300 leading-relaxed">${itemSummary}</td>
                            <td class="p-5 font-mono text-rose-400 font-bold">$${totalCost}</td>
                            <td class="p-5">
                                <span class="border px-2.5 py-1 rounded-full text-xs font-bold ${badgeColor}">
                                    ${status}
                                </span>
                            </td>
                            <td class="p-5 text-right">
                                ${isPending ? `
                                    <button onclick="fulfillOrder(${rowNumber}, '${studentName}', this)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3 py-1.5 rounded-xl transition shadow-md active:scale-95">
                                        Fulfill Order ✓
                                    </button>
                                ` : `
                                    <span class="text-xs text-slate-500 font-medium italic">Distributed 📦</span>
                                `}
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('orderList').innerHTML = `<tr><td colspan="6" class="p-20 text-center text-rose-400">⚠️ Error connecting to server. Check deployment URL.</td></tr>`;
            } finally {
                statusIndicator.classList.add('hidden');
            }
        }

        async function fulfillOrder(rowId, studentName, buttonEl) {
            if (!confirm(`Confirm fulfillment for student: ${studentName}?`)) return;

            buttonEl.innerText = "Saving...";
            buttonEl.disabled = true;

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "fulfillOrder",
                        rowIndex: rowId
                    })
                });
                const data = await res.json();

                if (data.success) {
                    // Instantly trigger a refresh upon success
                    await loadOrders();
                } else {
                    alert("Transaction update failed: " + data.message);
                    buttonEl.innerText = "Fulfill Order ✓";
                    buttonEl.disabled = false;
                }
            } catch (e) {
                alert("Network communication dropped. Please try again.");
                buttonEl.innerText = "Fulfill Order ✓";
                buttonEl.disabled = false;
            }
        }

        // Run immediately on page load
        loadOrders();
        
        // Auto-refresh every 20 seconds in background
        setInterval(loadOrders, 20000);
    </script>
</body>
</html>
